<style>
  :root {
    --bg: #f4f1e8;
    --paper: #ebe7da;
    --ink: #1a1a1a;
    --muted: #555;
    --faint: #8a8a84;
    --rule: rgba(0,0,0,0.08);
    --accent: #4b5f3b;
    --green: #4b5f3b;
    --green-soft: rgba(75,95,59,.42);
    --green-tint: #e2e6d2;
    --moss: #7f9a5e;
    --soil: #8a6a4b;
    --leaf: #3b5a2a;
    --thirst: #b5543a;
    --water: #4f7388;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: #1a1a1a;
    color: var(--ink);
    font-family: 'Cormorant Garamond', Garamond, Georgia, serif;
    overscroll-behavior: none;
  }
  body { min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; align-items: stretch; }
  button { font: inherit; color: inherit; }

  .stage {
    position: relative; width: 100%; max-width: 430px;
    background: var(--bg); overflow: hidden;
    min-height: 100vh; min-height: 100dvh;
    box-shadow: 0 20px 80px rgba(0,0,0,0.4);
  }
  /* paper grain over everything (clicks pass through) */
  .stage::after {
    content: ''; position: absolute; inset: 0; z-index: 30; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .28  0 0 0 0 .22  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); background-size: 240px 240px;
    opacity: .5; mix-blend-mode: multiply;
  }
  .leaf-img { display: block; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  /* stamp: rough-edged solid shape behind a button */
  .stamp { position: relative; isolation: isolate; border: 0; background: transparent; }
  .stamp::before {
    content: ''; position: absolute; inset: 0; z-index: -1; background: var(--green);
    border-radius: 14px 18px 12px 20px / 18px 12px 20px 14px; filter: url(#rough);
  }
  .stamp.light::before { background: var(--green-tint); }
  .stamp.thirst::before { background: var(--thirst); }
  .stamp.round::before { border-radius: 50%; }
  /* grainy mood blob */
  .mood { position: absolute; pointer-events: none; z-index: 0;
    background: radial-gradient(closest-side, rgba(127,154,94,.55), rgba(127,154,94,.22) 55%, rgba(127,154,94,0) 100%);
    filter: blur(14px); border-radius: 48% 52% 45% 55% / 55% 45% 55% 45%; }

  /* ============ PAGES + TRANSITIONS ============ */
  .page {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
    opacity: 0; pointer-events: none;
    transform: translateY(18px);
    transition: opacity 340ms var(--ease), transform 420ms var(--ease);
    scroll-behavior: smooth;
  }
  .page.active { opacity: 1; pointer-events: auto; transform: none; }
  .page.leaving { opacity: 0; transform: translateY(-10px); }
  @media (prefers-reduced-motion: reduce) {
    .page { transition: opacity 120ms linear; transform: none !important; }
  }

  /* ============ LOADER ============ */
  #loader {
    position: absolute; inset: 0; z-index: 50;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    transition: opacity 520ms var(--ease);
  }
  #loader.off { opacity: 0; pointer-events: none; }
  #loader .leaf-img { width: 84px; height: 84px; transform: scale(.6) rotate(-14deg); opacity: 0; animation: grow 1100ms var(--ease) forwards; }
  @keyframes grow { to { transform: none; opacity: 1; } }
  #loader .ld-title {
    font-family: 'Cinzel Decorative', serif; font-weight: 700; font-size: 22px; letter-spacing: .5px;
    opacity: 0; animation: fade 700ms 500ms var(--ease) forwards;
  }
  @keyframes fade { to { opacity: 1; } }

  /* ============ LANDING ============ */
  .hero { text-align: center; padding: 30px 20px 6px; position: relative; }
  .hero .mood { left: 50%; top: -60px; width: 380px; height: 300px; transform: translateX(-50%); }
  .hero > *:not(.mood) { position: relative; z-index: 1; }
  .leaf-logo { width: 58px; height: 58px; margin: 0 auto; }
  .home-title {
    font-family: 'Cinzel Decorative', 'Cormorant Garamond', serif;
    font-weight: 700; font-size: 44px; letter-spacing: 0.5px;
    margin: 14px 0 8px; color: var(--green);
  }
  .home-sub { font-size: 20px; font-weight: 500; letter-spacing: 0.6px; margin: 0 0 10px; }

  /* Today line: only shows when something needs water */
  .today {
    display: none; margin: 4px auto 6px; padding: 7px 16px;
    color: #fff;
    font-size: 15px; font-style: italic; letter-spacing: .3px; cursor: pointer;
    align-items: center; gap: 8px;
  }
  .today.on { display: inline-flex; }
  .today svg { width: 14px; height: 14px; }

  /* ============ CAROUSEL ============ */
  .carousel {
    display: flex; overflow-x: auto; overflow-y: visible;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    gap: 14px; padding: 18px 0 32px; scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 auto; width: 36vw; max-width: 146px;
    scroll-snap-align: center; text-align: center; cursor: pointer;
    transition: opacity 240ms ease; will-change: opacity;
  }
  .slide .card-stage {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    overflow: hidden; background: #fff; border-radius: 50%;
    box-shadow: 0 10px 24px rgba(60,70,40,.14);
  }
  .slide .oval {
    position: absolute; inset: 0; border: 1.5px solid rgba(75,95,59,.55);
    border-radius: 50%; pointer-events: none; z-index: 2;
  }
  .slide .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; z-index: 1; display: block; }
  .slide .badge {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    z-index: 3; display: none; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--thirst); color: #fff; font-size: 12px; letter-spacing: .4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .slide .badge svg { width: 10px; height: 10px; }
  .slide.thirsty .badge { display: inline-flex; }


  .slide .name {
    font-style: italic; font-weight: 600; font-size: 21px; line-height: 1.1;
    margin: 12px 0 1px; letter-spacing: 0.2px; white-space: nowrap; text-align: center;
  }
  .slide .name.long { font-size: 17px; margin-top: 14px; }
  .slide .origin { font-family: 'Special Elite', 'Courier New', monospace; font-size: 12.5px; color: var(--muted); margin: 0; letter-spacing: 0.3px; text-align: center; white-space: nowrap; }
  .carousel-empty { width: 100%; text-align: center; font-style: italic; color: var(--faint); padding: 30px 20px; }

  /* ============ ECOSYSTEM BUTTON + DROPDOWN ============ */
  .eco-wrap { margin-top: 10px; }
  .ecosystem { margin: 0 auto; text-align: center; background: transparent; border: 0; cursor: pointer; display: block; padding: 10px 14px 12px; }
  .ecosystem .label { font-family: 'Special Elite', 'Courier New', monospace; font-size: 15px; color: var(--green); letter-spacing: 1px; display: block; margin-bottom: 2px; }
  .ecosystem .leaf { width: 64px; height: 64px; display: block; margin: 0 auto; transition: transform 360ms var(--ease); }
  .ecosystem .chev { width: 16px; height: 16px; display: block; margin: 2px auto 0; color: var(--green); transition: transform 360ms var(--ease); }
  .ecosystem:active .leaf { transform: translateY(1px); }
  .eco-wrap.open .ecosystem .chev { transform: rotate(180deg); }
  .eco-wrap .list-section { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 460ms var(--ease); padding: 0; border-top: 0; }
  .eco-wrap.open .list-section { grid-template-rows: 1fr; border-top: 1px solid var(--rule); }
  .eco-wrap .list-inner { overflow: hidden; min-height: 0; }
  .eco-wrap.open .list-inner { padding: 22px 22px 40px; }
  .eco-wrap .list-section { border-radius: 42% 58% 0 0 / 14% 14% 0 0; }
  @media (prefers-reduced-motion: reduce) { .eco-wrap .list-section { transition: none; } }

  /* ============ INVENTORY LIST ============ */
  .list-section {
    background: var(--green-tint);
    background-image:
      radial-gradient(rgba(60,40,20,0.05) 1.2px, transparent 1.5px),
      radial-gradient(rgba(60,40,20,0.04) 1px, transparent 1.5px);
    background-size: 22px 22px, 38px 38px; background-position: 0 0, 9px 11px;
    padding: 26px 22px 60px; border-top: 1px solid var(--rule);
  }
  .list-section h2 { font-family: 'Special Elite', 'Courier New', monospace; font-size: 16px; font-weight: 400; color: var(--green); margin: 0 0 12px; text-align: center; letter-spacing: 1.5px; text-transform: uppercase; }
  .row {
    display: flex; align-items: center; gap: 14px; padding: 10px 4px; cursor: pointer;
    border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .row:last-child { border-bottom: 0; }
  .row:active { background: rgba(75,95,59,.10); }
  .row .bullet { width: 20px; height: 20px; flex: 0 0 20px; }
  .row .text { font-family: 'Special Elite', 'Courier New', monospace; font-size: 14.5px; line-height: 1.35; flex: 1; letter-spacing: .1px; }
  .row .text .sp { color: var(--ink); }
  .row .text .cn { color: var(--muted); }
  .row .status { font-family: 'Special Elite', 'Courier New', monospace; font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .row .status svg { width: 11px; height: 11px; }
  .row.thirsty .status { color: var(--thirst); }

  /* In-memoriam button on landing */
  .memoriam-link { display: block; margin: 14px auto 36px; background: transparent; border: 0; cursor: pointer; text-align: center; color: #555; padding: 6px 10px; }
  .memoriam-link svg { width: 38px; height: 50px; display: block; margin: 0 auto 6px; color: var(--green); }
  .memoriam-link .label { font-style: italic; font-size: 14px; letter-spacing: 0.4px; }

  /* ============ DETAIL / FIELD GUIDE ============ */
  .topbar {
    position: sticky; top: 0; z-index: 8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px 8px;
    background: rgba(253,253,251,.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  .topbar .ib { width: 40px; height: 40px; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer; border-radius: 50%; }
  .topbar .ib:active { background: rgba(80,110,70,.10); }
  .topbar .ib svg { width: 26px; height: 26px; }
  .topbar .ib.church svg { width: 20px; height: 26px; color: #333; opacity: .7; }
  .topbar .ib .leaf-img { width: 30px; height: 30px; }
  .topbar .ib.back { font-size: 30px; line-height: 1; color: var(--green); padding-bottom: 6px; }
  .topbar .grp { display: flex; align-items: center; gap: 2px; }
  .topbar .ib.eco { position: relative; }
  .topbar .ib.eco .chev { position: absolute; right: 1px; bottom: 3px; width: 11px; height: 11px; color: var(--green); transition: transform 300ms var(--ease); }
  .topbar.open .ib.eco .chev { transform: rotate(180deg); }
  .head-eco {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 9;
    background: var(--green-tint); border-bottom: 1px solid var(--green-soft);
    max-height: 0; overflow: hidden; transition: max-height 420ms var(--ease);
    border-radius: 0 0 40% 60% / 0 0 10% 10%;
  }
  .topbar.open .head-eco { max-height: 70vh; overflow-y: auto; }
  .head-eco .list-inner { padding: 16px 18px 24px; }
  .head-eco h2 { font-family: 'Special Elite', 'Courier New', monospace; font-size: 14px; font-weight: 400; color: var(--green); margin: 0 0 8px; text-align: center; letter-spacing: 1.5px; text-transform: uppercase; }
  .head-eco .row { padding: 8px 2px; }
  .topbar .topname { font-style: italic; font-size: 18px; font-weight: 500; letter-spacing: .3px; color: var(--green); }

  .hero-photo { padding: 22px 44px 0; text-align: center; position: relative; }
  .hero-photo .mood { left: 50%; top: 10px; width: 300px; height: 300px; transform: translateX(-50%); }
  .hero-photo img.plant-photo { position: relative; z-index: 1; max-height: 320px; max-width: 100%; width: auto; height: auto; display: inline-block; filter: drop-shadow(0 16px 18px rgba(0,0,0,.14)); user-select: none; -webkit-user-drag: none; }
  .zoom-hint {
    display: inline-flex; align-items: center; gap: 6px; margin: 14px auto 0;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--green-soft);
    background: var(--bg); color: var(--green); font-size: 14px; font-style: italic; line-height: 1; cursor: zoom-in;
  }
  .zoom-hint svg { width: 14px; height: 14px; }
  .nav-arrow {
    position: absolute; top: 45%; transform: translateY(-50%); z-index: 2;
    width: 40px; height: 40px; color: #fff; font-size: 26px; line-height: 1; cursor: pointer;
    display: grid; place-items: center; padding: 0 0 4px;
  }
  .nav-arrow.prev { left: 8px; } .nav-arrow.next { right: 8px; }
  .nav-arrow:active { transform: translateY(-50%) scale(.94); }
  .pp { animation: none; }
  .pp.from-right { animation: fromR 380ms var(--ease); }
  .pp.from-left { animation: fromL 380ms var(--ease); }
  @keyframes fromR { from { transform: translateX(46px); opacity: 0; } }
  @keyframes fromL { from { transform: translateX(-46px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pp.from-right, .pp.from-left { animation: none; } }

  .guide { padding: 22px 22px 10px; }
  .latin {
    font-family: 'Cinzel Decorative', serif; font-weight: 700; font-size: 25px; line-height: 1.15;
    margin: 0 0 4px; letter-spacing: .2px; color: var(--green);
  }
  .common { margin: 0 0 18px; font-style: italic; font-size: 18px; color: var(--muted); }

  .tax { width: 100%; border-collapse: collapse; margin: 0 0 22px; font-size: 16px; }
  .tax td { padding: 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .tax td:first-child { width: 112px; font-variant: small-caps; letter-spacing: 1px; color: var(--green); font-weight: 600; }
  .tax td:last-child { font-style: italic; }
  .tax td:last-child.rm { font-style: normal; }

  .sec-h {
    font-variant: small-caps; letter-spacing: 1.4px; font-weight: 700; font-size: 17px;
    margin: 0 0 4px; color: var(--green);
  }
  .origin { display: flex; gap: 16px; align-items: flex-start; margin: 0 0 26px; }
  .origin img { width: 96px; flex: 0 0 96px; height: auto; }
  .origin p { margin: 0; font-size: 17px; line-height: 1.45; }

  .figblock { display: flex; gap: 16px; align-items: flex-start; margin: 0 0 22px; padding: 0 0 18px; border-bottom: 1px dashed var(--green-soft); }
  .figblock:last-of-type { border-bottom: 0; }
  .figblock figure { margin: 0; flex: 0 0 108px; width: 108px; text-align: center; }
  .figblock figure img { max-width: 108px; max-height: 128px; width: auto; height: auto; }
  .figblock .body { flex: 1; min-width: 0; }
  .figblock p { margin: 0; font-size: 17px; line-height: 1.45; }
  .callouts { list-style: none; margin: 0; padding: 0; }
  .callouts li { position: relative; padding-left: 16px; font-size: 17px; line-height: 1.4; margin: 0 0 3px; }
  .callouts li::before { content: ''; position: absolute; left: 0; top: .72em; width: 9px; height: 1px; background: var(--ink); }
  .figcap { margin-top: 6px !important; font-size: 13px !important; font-style: italic; color: var(--faint); letter-spacing: .2px; }
  .figcap b { font-weight: 600; font-style: normal; color: var(--muted); }

  .care-title {
    font-family: 'Cinzel Decorative', serif; font-weight: 700; font-size: 18px; letter-spacing: .5px;
    text-align: center; margin: 28px 0 14px; position: relative; color: var(--green);
  }
  .care-title::before, .care-title::after {
    content: ''; position: absolute; top: 50%; width: 26%; height: 1px; background: var(--green-soft);
  }
  .care-title::before { left: 0; } .care-title::after { right: 0; }
  .care-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .care-card { border-top: 1.5px solid var(--green-soft); padding-top: 8px; }
  .care-card h4 { font-variant: small-caps; letter-spacing: 1.2px; font-weight: 700; font-size: 15px; margin: 0 0 4px; color: var(--green); }
  .care-card p { margin: 0; font-size: 15.5px; line-height: 1.42; }
  .care-card ul { margin: 0; padding-left: 14px; font-size: 15.5px; line-height: 1.42; }
  .care-card li { margin-bottom: 3px; }
  .care-card.wide { grid-column: 1 / -1; }

  .note {
    margin: 24px 0 0; padding: 14px 16px 12px; border: 1.5px solid var(--green); position: relative;
    border-radius: 18px 10px 22px 12px / 12px 20px 10px 18px; background: rgba(255,255,255,.35);
  }
  .note .lbl {
    position: absolute; top: -9px; left: 14px; padding: 0 8px; background: var(--bg);
    font-variant: small-caps; letter-spacing: 1.6px; font-size: 13px; font-weight: 700; color: var(--green);
    border-radius: 8px;
  }
  .note p { margin: 0; font-size: 16px; line-height: 1.45; }

  /* ============ JOURNAL ============ */
  .journal {
    margin: 0 0 24px; padding: 14px 16px 12px;
    background: var(--green-tint); border: 0; border-radius: 26px 34px 22px 38px / 34px 22px 38px 26px;
    position: relative;
  }
  .j-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .j-head .sec-h { margin: 0; }
  .j-head .int { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); font-style: italic; }
  .j-head .int button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--green-soft); background: var(--bg); cursor: pointer; font-size: 16px; line-height: 1; display: grid; place-items: center; }
  .j-status { display: flex; align-items: center; gap: 12px; padding: 8px 0 12px; }
  .j-status .drop { width: 30px; height: 30px; flex: 0 0 30px; color: var(--water); }
  .j-status.thirsty .drop { color: var(--thirst); }
  .j-status.empty .drop { color: var(--faint); }
  .j-status strong { display: block; font-size: 19px; font-weight: 600; line-height: 1.15; }
  .j-status.thirsty strong { color: var(--thirst); }
  .j-status span { font-size: 14px; color: var(--muted); font-style: italic; }
  .j-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .j-actions button {
    padding: 9px 4px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 14px; letter-spacing: .3px; color: #fff;
  }
  .j-actions button svg { width: 20px; height: 20px; color: #fff; }
  .j-actions button:active { transform: translateY(1px); }
  .j-log { list-style: none; margin: 12px 0 0; padding: 8px 0 0; border-top: 1px dashed rgba(0,0,0,.15); }
  .j-log li { display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 3px 0; }
  .j-log li svg { width: 14px; height: 14px; color: var(--accent); flex: 0 0 14px; }
  .j-log li .d { color: var(--faint); font-style: italic; margin-left: auto; font-size: 13px; }
  .j-log li .x { border: 0; background: transparent; color: var(--faint); cursor: pointer; padding: 0 2px; font-size: 16px; line-height: 1; }
  .j-log li.more { justify-content: center; font-style: italic; color: var(--faint); cursor: pointer; font-size: 14px; }
  .j-empty { font-size: 14px; font-style: italic; color: var(--faint); margin: 8px 0 0; }

  /* ============ ZOOM VIEWER ============ */
  #zoom {
    position: absolute; inset: 0; z-index: 40; background: rgba(12,12,10,.96);
    display: none; touch-action: none; overflow: hidden;
  }
  #zoom.on { display: block; }
  #zoom img { position: absolute; left: 0; top: 0; width: 100%; height: auto; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; will-change: transform; }
  #zoom .close {
    position: absolute; top: 12px; right: 12px; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); color: #fff; font-size: 22px; line-height: 1; cursor: pointer;
  }
  #zoom .hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.55); font-size: 14px; font-style: italic; pointer-events: none; }

  /* ============ SHEET (confirm) ============ */
  #sheet { position: absolute; inset: 0; z-index: 45; display: none; align-items: flex-end; background: rgba(0,0,0,.35); }
  #sheet.on { display: flex; }
  #sheet .card {
    width: 100%; background: var(--bg); border-radius: 18px 18px 0 0; padding: 22px 22px 30px;
    text-align: center; animation: up 260ms var(--ease);
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  #sheet .card svg { width: 34px; height: 46px; margin: 0 auto 10px; display: block; color: #333; }
  #sheet .card h3 { font-weight: 600; font-size: 21px; margin: 0 0 4px; font-style: italic; }
  #sheet .card p { margin: 0 0 18px; color: var(--muted); font-size: 16px; }
  #sheet .btns { display: flex; gap: 10px; }
  #sheet .btns button { flex: 1; padding: 11px; font-size: 16px; cursor: pointer; color: var(--green); }
  #sheet .btns button.go { color: #fff; }
  #sheet .card { border-radius: 40px 28px 0 0 / 30px 22px 0 0; }

  /* ============ MEMORIAL PAGE ============ */
  .memorial-hero { padding: 28px 20px 10px; text-align: center; }
  .memorial-title {
    font-family: 'Cinzel Decorative', serif; font-weight: 700; font-size: 34px; line-height: 1.1;
    margin: 14px 20px 22px; text-align: center; color: var(--green);
  }
  .memorial-church { width: 60px; height: 80px; color: var(--green); display: block; margin: 0 auto 24px; }
  .memorial-thumb { filter: grayscale(1) contrast(.92) sepia(.25); }
  .memorial-list { padding: 0 20px 80px; }
  .memorial-card { text-align: center; margin: 0 auto 30px; }
  .memorial-thumb {
    width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 10px;
    background-color: #eee; background-repeat: no-repeat; background-position: 50% 50%; background-size: cover;
    filter: grayscale(1) contrast(0.92); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
  }
  .memorial-name { font-style: italic; font-weight: 600; font-size: 22px; margin: 6px 0 2px; }
  .memorial-date { font-size: 14px; color: #555; margin: 0; }
  .memorial-restore { margin-top: 6px; border: 0; background: transparent; font-size: 13px; font-style: italic; color: var(--faint); text-decoration: underline; cursor: pointer; }
  .memorial-empty { text-align: center; font-style: italic; color: #888; margin: 40px 20px; }

  @media (hover: hover) {
    .row:hover { background: rgba(80,110,70,.05); }
    .topbar .ib:hover { background: rgba(80,110,70,.08); }
  }
  @supports (padding: env(safe-area-inset-top)) {
    .stage { padding-top: env(safe-area-inset-top); }
  }
</style>
</head>

const PLANTS = {"fittonia":{"id":"fittonia","name":"Fittonia","latin":"Fittonia albivenis","common":"Nerve Plant","origin":"Peru","frame":2,"water":3,"pos":"50% 27%","size":"240%","frameSrc":"Frame%202.png","taxonomy":{"family":"Acanthaceae","genus":"Fittonia","species":"F. albivenis","common":"Nerve Plant"},"origin_heading":"Origin & habitat","origin_text":"Native to the tropical rainforests of Peru, in South America. Grows low to the ground in humid, shaded forest floors where it spreads as a creeping herb.","origin_label":"PERU","figures":[{"n":1,"caption":"Habit. Young specimen in cultivation."},{"n":2,"caption":"Leaf (dorsal view)."},{"n":3,"caption":"Node with adventitious roots."},{"n":4,"caption":"Flower (side view)."},{"n":5,"caption":"Leaf (ventral view)."},{"n":6,"caption":"Root system."}],"sections":[{"heading":"Leaf anatomy","callouts":["Bright venation (varies pink to red)","Soft, velvety texture","Ovate shape with entire margins","Fine reticulate vein pattern"],"text":null,"fig":2},{"heading":"Growth habit","callouts":[],"text":"Low-growing, spreading stems that root at nodes.","fig":3},{"heading":"Flowers","callouts":[],"text":"Tiny, tubular flowers appear on short spikes. Rare indoors, but possible in optimal conditions.","fig":4},{"heading":"Leaf underside","callouts":["Paler green with lighter venation."],"text":null,"fig":5},{"heading":"Root system","callouts":[],"text":"Fibrous, shallow roots adapted to moist, organic forest soil.","fig":6}],"care":[{"heading":"Best placement in the house","text":"Bright, indirect light. Ideal in kitchens, bathrooms, or terrariums where humidity is high. Keep away from direct sunlight.","bullets":[]},{"heading":"Watering habits","text":"Keep soil evenly moist but not soggy. Water when the top 1–2 cm feels dry. Use room temperature water.","bullets":[]},{"heading":"Repotting","text":"Repot every 1–2 years or when roots fill the pot. Use a light, well-draining mix rich in organic matter.","bullets":[]},{"heading":"Spraying & Humidity","text":"High humidity is essential (60%+). Mist regularly or place near a pebble tray or humidifier.","bullets":[]},{"heading":"Best care tips","text":null,"bullets":["Maintain warm temperatures (18–26°C).","Avoid cold drafts.","Trim occasionally to keep bushy and compact.","Wipe leaves gently to remove dust."]},{"heading":"Interesting facts","text":null,"bullets":["The name “Fittonia” honors Elizabeth Fitton, author of “Conversations on Botany” (1694).","Leaves fold in low light or when thirsty—an adaptation to conserve moisture.","Popular in Victorian plant collections and closed terrariums."]}],"note":"Fittonia is sensitive to overwatering and cold. Wilting leaves are often a sign of thirst—water and provide humidity to revive."},"peperomia":{"id":"peperomia","name":"Peperomia","latin":"Peperomia caperata","common":"Emerald Ripple Peperomia","origin":"Brazil","frame":3,"water":7,"pos":"50% 25%","size":"245%","frameSrc":"Frame%203.png","taxonomy":{"family":"Piperaceae","genus":"Peperomia","species":"P. caperata","common":"Emerald Ripple Peperomia"},"origin_heading":"Origin & habitat","origin_text":"Native to the tropical rainforests of Brazil, where it grows on the forest floor in warm, humid conditions. An epiphytic or trerestrial plant often found in the understory in shaded, moist environments.","origin_label":"BRAZIL","figures":[{"n":1,"caption":"Habit. Young specimen in cultivation."},{"n":2,"caption":"Leaf (upper & lower view)."},{"n":3,"caption":"Growth habit."},{"n":4,"caption":"Inflorescence."},{"n":5,"caption":"Leaf (upper surface)."},{"n":6,"caption":"Crown and stems."}],"sections":[{"heading":"Leaf anatomy","callouts":["Heavily quilted surface with distinct veins","Upper surface dark green to silvery green","Underside burgundy to purple","Heart-shaped with pointed tip"],"text":null,"fig":2},{"heading":"Growth habit","callouts":[],"text":"Compact, clumping growth from a central crown. Short stems with leaves held on reddish petioles.","fig":3},{"heading":"Flowers","callouts":["Detail of spike."],"text":"Produces slender, spike-like inflorescences (“catkins”) that rise above the foliage. Flowers are tiny and inconspicuous.","fig":4},{"heading":"Leaf detail","callouts":["Deeply corrugated surface gives a rippled, embossed appearance."],"text":null,"fig":5},{"heading":"Stem & Crown","callouts":[],"text":"Crown growth habit with short, fleshy stems. New leaves emerge from the center.","fig":6}],"care":[{"heading":"Best placement in the house","text":"Bright, indirect light. Ideal for shelves, desks, or bathrooms where humidity is higher. Avoid direct sunlight, which can scorch leaves.","bullets":[]},{"heading":"Watering habits","text":"Allow the top 2–3 cm of soil to dry out between waterings. Keep soil evenly moist but not soggy. Reduce watering in winter.","bullets":[]},{"heading":"Repotting","text":"Repot every 1–2 years or when the plant becomes root-bound. Use a well-draining mix rich in organic matter.","bullets":[]},{"heading":"Spraying & Humidity","text":"Prefers moderate to high humidity (50%+). Mist occasionally or place near a pebble tray or humidifier.","bullets":[]},{"heading":"Best care tips","text":null,"bullets":["Maintain warm temperatures (18–26°C).","Avoid cold drafts and sudden changes.","Use a well-draining, aerated potting mix.","Rotate occasionally for even growth.","Dust leaves gently with a soft cloth."]},{"heading":"Interesting facts","text":null,"bullets":["Named “caperata” for its puckered, wrinkled leaves (“caperatus” means wrinkled in Latin).","Peperomias are excellent air-purifying houseplants.","Non-toxic to pets and humans.","A popular cultivar in Victorian plant collections for its unique foliage."]}],"note":"Peperomia caperata is a slow-growing, low-maintenance plant that rewards with lush, textured foliage and rich color—perfect for small spaces."},"kalanchoe":{"id":"kalanchoe","name":"Kalanchoe","latin":"Kalanchoe blossfeldiana","common":"Florist Kalanchoe","origin":"Madagascar","frame":4,"water":10,"pos":"50% 23%","size":"240%","frameSrc":"Frame%204.png","taxonomy":{"family":"Crassulaceae","genus":"Kalanchoe","species":"K. blossfeldiana","common":"Florist Kalanchoe"},"origin_heading":"Origin & habitat","origin_text":"Native to Madagascar. Thrives in arid, rocky environments with bright sunlight and well-draining soils. A succulent adapted to store water in its leaves to survive dry periods.","origin_label":"MADAGASCAR","figures":[{"n":1,"caption":"Habit. Young specimen in cultivation."},{"n":2,"caption":"Leaf (upper view)."},{"n":3,"caption":"Growth habit. Young plant."},{"n":4,"caption":"Flower cluster."},{"n":5,"caption":"Leaf section (transverse)."},{"n":6,"caption":"Stem base and roots."}],"sections":[{"heading":"Leaf anatomy","callouts":["Thick, fleshy leaf stores water","Scalloped margins","Smooth, waxy surface helps reduce water loss"],"text":null,"fig":2},{"heading":"Growth habit","callouts":[],"text":"Compact, branching succulent. Forms clumps of broad leaves on short, fleshy stems.","fig":3},{"heading":"Flowers","callouts":[],"text":"Produces clusters of small, four-petaled flowers in a range of colors including pink, red, orange, yellow, and white. Blooms mainly in late winter to spring.","fig":4},{"heading":"Leaf cross section","callouts":["Waxy cuticle reduces evaporation","Succulent water-storing tissue","Thin epidermis"],"text":null,"fig":5},{"heading":"Stem & Roots","callouts":[],"text":"Fleshy stems store water and support leaf clusters. Fibrous roots anchor the plant in shallow soil and absorb moisture efficiently.","fig":6}],"care":[{"heading":"Best placement in the house","text":"Bright light is essential. Place near a sunny window (south or west facing). A few hours of direct sun each day encourages strong growth and flowering.","bullets":[]},{"heading":"Watering habits","text":"Allow soil to dry out between waterings. Water thoroughly until it drains, then do not water again until the top 2–3 cm of soil is dry. Overwatering can cause root rot.","bullets":[]},{"heading":"Repotting","text":"Repot every 1–2 years or when the plant outgrows its pot. Use a well-draining cactus or succulent mix. Choose a pot with drainage holes.","bullets":[]},{"heading":"Spraying & Humidity","text":"Low to moderate humidity is fine. No need to mist. Good air circulation helps prevent fungal issues.","bullets":[]},{"heading":"Best care tips","text":null,"bullets":["Prefers warm temperatures (18–26°C).","Protect from frost and cold drafts.","Deadhead spent flowers to encourage re-blooming.","Rotate the plant occasionally for even growth."]},{"heading":"Interesting facts","text":null,"bullets":["The name “Kalanchoe” comes from the Chinese words “kalos” (good) and “anchos” (plant).","Some Kalanchoe species produce tiny plantlets along the leaf edges.","Widely used as a flowering houseplant and is known for its long-lasting blooms."]}],"note":"Kalanchoe is a succulent. It prefers to be slightly dry rather than constantly moist. When in doubt, wait to water."},"monstera":{"id":"monstera","name":"Monstera","latin":"Monstera deliciosa","common":"Swiss Cheese Plant","origin":"Mexico","frame":5,"water":7,"pos":"50% 22%","size":"235%","frameSrc":"Frame%205.png","taxonomy":{"family":"Araceae","genus":"Monstera","species":"M. deliciosa","common":"Swiss Cheese Plant"},"origin_heading":"Origin & habitat","origin_text":"Native to the tropical rainforests of southern Mexico, from which it extends to Panama. A climbing, hemiepiphytic plant that grows on trees in warm, humid environments with filtered light.","origin_label":"MEXICO TO PANAMA","figures":[{"n":1,"caption":"Habit. Mature specimen in cultivation."},{"n":2,"caption":"Leaf (upper view)."},{"n":3,"caption":"Climbing stem with aerial roots."},{"n":4,"caption":"Spathe & spadix."},{"n":5,"caption":"Leaf maturation (young to mature). Fenestrations increase with age and light."},{"n":6,"caption":"Aerial root (detail)."}],"sections":[{"heading":"Leaf anatomy","callouts":["Natural splits and holes (fenestrations) develop as the leaf matures.","Thick, glossy cuticle reduces water loss.","Heart-shaped base with a deep sinus."],"text":null,"fig":2},{"heading":"Growth habit","callouts":[],"text":"A climbing aroid that uses aerial roots to attach to support and ascend toward light. Leaves increase in size and develop more fenestrations as the plant matures.","fig":3},{"heading":"Inflorescence","callouts":[],"text":"Produces a spathe and spadix when mature. Blooms are rare indoors but may result in an edible fruit in nature.","fig":4},{"heading":"Aerial roots","callouts":[],"text":"Thick, wiry roots arise from the nodes and absorb moisture and nutrients from the air and support surfaces.","fig":6},{"heading":"Leaf development","callouts":[],"text":null,"fig":5}],"care":[{"heading":"Best placement in the house","text":"Bright, indirect light is ideal. Tolerates medium light but growth may slow and leaves may be smaller with fewer fenestrations. Avoid direct, harsh sun.","bullets":[]},{"heading":"Watering habits","text":"Allow the top 2–3 cm of soil to dry out between waterings. Water thoroughly until it drains out the bottom. Reduce watering in winter.","bullets":[]},{"heading":"Repotting","text":"Repot every 1–2 years or when root-bound. Use a well-draining, aroid mix rich in organic matter with bark, perlite and coco coir. Pot with drainage holes.","bullets":[]},{"heading":"Spraying & Humidity","text":"Prefers moderate to high humidity (50%+). Mist occasionally or place near a pebble tray or humidifier. Wipe leaves to remove dust and keep pores clear.","bullets":[]},{"heading":"Best care tips","text":null,"bullets":["Provide a moss pole or support for healthy climbing.","Rotate the plant occasionally for even growth.","Keep leaves clean for best photosynthesis.","Protect from cold drafts and sudden temperature changes."]},{"heading":"Interesting facts","text":null,"bullets":["The name “Monstera” comes from the Latin “monstrum,” meaning “monster,” in reference to its huge leaves.","In the wild, leaves can grow over 90 cm (3 ft) wide when mature.","The fruit (when ripe) tastes like a mix of pineapple and banana."]}],"note":"Monstera deliciosa is a fast-growing houseplant that rewards with stunning foliage. As it matures and climbs, leaves become larger and beautifully fenestrated."},"pothos":{"id":"pothos","name":"Epipremnum","latin":"Epipremnum aureum","common":"Pothos / Devil's Ivy","origin":"French Polynesia","frame":6,"water":7,"pos":"50% 21%","size":"220%","frameSrc":"Frame%206.png","taxonomy":{"family":"Araceae","genus":"Epipremnum","species":"E. aureum","common":"Pothos, Devil’s Ivy"},"origin_heading":"Origin & habitat","origin_text":"Native to the tropical regions of Moorea in the Society Islands of French Polynesia. Well adapted to a wide range of indoor conditions and able to thrive in low to bright indirect light.","origin_label":"SOCIETY ISLANDS (FRENCH POLYNESIA) / MOOREA","figures":[{"n":1,"caption":"Habit. Mature specimen in cultivation."},{"n":2,"caption":"Leaf (upper view)."},{"n":3,"caption":"Vine with aerial roots."},{"n":4,"caption":"Examples of leaf variegation."},{"n":5,"caption":"Node with aerial roots."},{"n":6,"caption":"Stem and node."}],"sections":[{"heading":"Leaf anatomy","callouts":["Heart-shaped with an acuminate tip","Variegation varies from yellow to cream","Glossy surface with smooth margins"],"text":null,"fig":2},{"heading":"Growth habit","callouts":[],"text":"A vigorous, climbing or trailing vine with nodes that produce aerial roots. Can be trained upward on a support or allowed to cascade.","fig":3},{"heading":"Leaf variation","callouts":[],"text":"Variegation patterns are unique to each plant and may change with light conditions.","fig":4},{"heading":"Stem structure","callouts":[],"text":"Green, flexible stems with visible nodes. New leaves emerge from the nodes.","fig":6},{"heading":"Aerial roots","callouts":[],"text":"Emerge from the nodes along the stem. These roots anchor the plant to surfaces and absorb moisture and nutrients from the air.","fig":5}],"care":[{"heading":"Best placement in the house","text":"Bright, indirect light is best. Tolerates low light but variegation may fade and growth will slow. Avoid direct sun, which can scorch leaves.","bullets":[]},{"heading":"Watering habits","text":"Water when the top 2–3 cm of soil feels dry. Do not let the plant sit in water. Reduce watering in winter.","bullets":[]},{"heading":"Repotting","text":"Repot every 1–2 years or when the plant becomes root-bound. Use a well-draining potting mix. A slightly larger pot is usually sufficient.","bullets":[]},{"heading":"Spraying & humidity","text":"Prefers moderate to high humidity. Mist occasionally or place near a pebble tray or humidifier.","bullets":[]},{"heading":"Best care tips","text":null,"bullets":["Easy to grow and very forgviing.","Wipe leaves gently with a damp cloth to remove dust.","Prune to encourage fuller growth.","Toxic to pets if ingested."]},{"heading":"Interesting facts","text":null,"bullets":["Known as “Devil’s Ivy” because of its hardy nature—it is difficult to kill.","Excellent at improving indoor air quality by filtering toxins.","A popular trailing or climbing houseplant around the world."]}],"note":"Epipremnum aureum is a very adaptable houseplant that can thrive in a range of light conditions and is ideal for beginners and busy plant lovers."},"yucca":{"id":"yucca","name":"Yucca","latin":"Yucca elephantipes","common":"Spineless Yucca","origin":"Mexico","frame":7,"water":14,"pos":"50% 20%","size":"220%","frameSrc":"Frame%207.png","taxonomy":{"family":"Asparagaceae","genus":"Yucca","species":"Y. elephantipes","common":"Spineless Yucca"},"origin_heading":"Origin & habitat","origin_text":"Native to the arid regions of southern Mexico and parts of Central America. Grows in dry, rocky habitats from sea level to moderate elevations. Adapted to drought and intense sun.","origin_label":"MEXICO","figures":[{"n":1,"caption":"Habit. Mature specimen in cultivation."},{"n":2,"caption":"Leaf (full length)."},{"n":3,"caption":"Trunk detail."},{"n":4,"caption":"Flower spike."},{"n":5,"caption":"Leaf rosette."},{"n":6,"caption":"Leaf base on stem."},{"n":7,"caption":"Fibrous root system."}],"sections":[{"heading":"Leaf anatomy","callouts":["Stiff, sword-shaped leaf with a pointed tip","Smooth margins without spines","Tough, waxy surface reduces water loss","Leaves grow in dense rosettes at the ends of stems"],"text":null,"fig":2},{"heading":"Trunk (stem)","callouts":[],"text":"Thick, woody stem that stores water and nutrients. Old leaf bases form ringed scars along the trunk.","fig":3},{"heading":"Flowers","callouts":[],"text":"Produces tall spikes of pendant, bell-shaped, white flowers. Blooms are rare indoors but common in mature outdoor plants.","fig":4},{"heading":"Leaf rosette (top view)","callouts":[],"text":null,"fig":5},{"heading":"Leaf base","callouts":["Leaves arise from the growing tip of the stem","Old leaf bases remain attached, forming rings"],"text":null,"fig":6},{"heading":"Root system","callouts":[],"text":"Fibrous roots that spread widely and anchor the plant. Adapted to well-draining, sandy or rocky soils.","fig":7}],"care":[{"heading":"Best placement in the house","text":"Bright light is essential. Place near a south or west-facing window. Tolerates a few hours of direct sun. Avoid low light, which can cause weak growth.","bullets":[]},{"heading":"Watering habits","text":"Water thoroughly but allow soil to dry out completely between waterings. Water less in winter. Overwatering can cause root rot.","bullets":[]},{"heading":"Repotting","text":"Repot every 2–3 years or when the plant becomes root-bound. Use a well-draining, gritty mix. Choose a pot with drainage holes.","bullets":[]},{"heading":"Spraying & Humidity","text":"Low humidity is preferred. No need to mist. Wipe leaves occasionally to remove dust and keep them healthy.","bullets r sunny windowsills or kitchen counters. Ensure good airflow.","bullets":[]},{"heading":"Watering habits","text":"Keep soil evenly moist but not soggy. Water when the top inch of soil feels dry. Avoid letting the plant sit in water.","bullets":[]},{"heading":"Feeding","text":"Feed every 2–3 weeks during the growing season with a balanced liquid fertilizer or organic plant food.","bullets":[]},{"heading":"Pinching & Harvesting","text":"Pinch or snip the top sets of leaves regularly to promote bushy growth. Harvest leaves often before the plant flowers for best flavor.","bullets":[]},{"heading":"Best care tips","text":null,"bullets":["Prefers warm temperatures (65–95°F / 18–35°C).","Protect from cold and frost.","Use fresh leaves for best flavor.","Avoid letting the plant flower—this reduces flavor."]},{"heading":"Interesting facts","text":null,"bullets":["Basil is a culinary staple in many cuisines, especially Italian and Thai.","Rich in essential oils and antioxidants.","Over 60 varieties of basil exist, including Sweet, Thai, Lemon, and Purple Basil."]}],"note":"Regular harvesting keeps basil productive and flavorful. Basil is sensitive to cold—bring indoors if temperatures drop below 55°F (13°C)."},"tomato":{"id":"tomato","name":"Cherry Tomato","latin":"Solanum lycopersicum","common":"Cherry Tomato","origin":"South America","frame":12,"water":2,"pos":"50% 25%","size":"235%","frameSrc":"Frame%2012.png","taxonomy":{"family":"Solanaceae","genus":"Solanum","species":"S. lycopersicum","common":"Tomato"},"origin_heading":"Origin & habitat","origin_text":"Native to western South America (Peru, Ecuador, Bolivia). Cultivated worldwide in warm temperate to tropical climates. Thrives in full sun and well-drained soil.","origin_label":"SOUTH AMERICA","figures":[{"n":1,"caption":"Habit. Young tomato plant in cultivation."},{"n":2,"caption":"Leaf (dorsal view)."},{"n":3,"caption":"Stem with flower cluster and leaf nodes."},{"n":4,"caption":"Flower (side view)."},{"n":5,"caption":"Fruit in development stages."},{"n":6,"caption":"Root system."}],"sections":[{"heading":"Leaf anatomy","callouts":["Deep green color","Slightly hairy (texture)","Pinnate shape with serrated margins","Prominent veins"],"text":null,"fig":2},{"heading":"Growth habit","callouts":[],"text":"Herbaceous, vining plant. Grows upright with support or sprawls if unstaked.","fig":3},{"heading":"Flowers","callouts":[],"text":"Small, yellow, star-shaped flowers in clusters. Self-pollinating but benefit from insects for higher yield.","fig":4},{"heading":"Fruit","callouts":[],"text":"Berry fruit (botanically), typically red when ripe, but can be yellow, orange, or green depending on variety.","fig":5},{"heading":"Root system","callouts":[],"text":"Fibrous, shallow to moderate roots that spread widely and require rich, well-drained soil.","fig":6}],"care":[{"heading":"Best placement in the house","text":"Bright, direct sunlight (6–8+ hours daily). Ideal for balconies, patios, or sunny windowsills. Needs good airflow.","bullets":[]},{"heading":"Watering habits","text":"Keep soil evenly moist but not soggy. Water at the base of the plant. Allow the top inch of soil to dry between waterings.","bullets":[]},{"heading":"Repelling & Support","text":"Use stakes, cages, or trellises. Repot or transplant every 2–3 years or when root bound.","bullets":[]},{"heading":"Feeding","text":"Feed every 2–3 weeks during growing season with a balanced fertilizer or one higher in potassium and phosphorus.","bullets":[]},{"heading":"Pollination","text":"Self-pollinating but bees and other pollinators improve fruit set and yield. Gently shake plants to help pollination indoors.","bullets":[]},{"heading":"Best care tips","text":null,"bullets":["Prune suckers (side shoots) for better airflow and larger fruit.","Mulch to retain moisture.","Harvest regularly to encourage more fruit."]},{"heading":"Interesting facts","text":null,"bullets":["Tomatoes are technically berries!","Rich in vitamins A, C, and antioxidants like lycopene.","Over 10,000+ tomato varieties exist worldwide."]}],"note":"Tomatoes are sensitive to frost and cold weather. Protect from temperatures below 10°C (50°F). Consistent care, sunlight, and nutrients lead to abundant harvests."}};
const ORDER = ['fittonia','peperomia','kalanchoe','monstera','pothos','yucca','schefflera','echeveria','maranta','basil','tomato'];

/* ===================== STORAGE ===================== */
const DEAD_KEY = 'the-shire-deceased';
const JOURNAL_KEY = 'the-shire-journal';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const getDead = () => load(DEAD_KEY, []);
const setDead = (l) => save(DEAD_KEY, l);
const isDead = (id) => getDead().some(d => d.id === id);
const getJournal = () => load(JOURNAL_KEY, { log: {}, every: {} });
const setJournal = (j) => save(JOURNAL_KEY, j);

const pad = (n) => (n < 10 ? '0' : '') + n;
const DAY = 86400000;
const fmtDate = (iso) => { const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`; };
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ===================== WATER STATUS ===================== */
function waterInfo(id) {
  const j = getJournal();
  const every = j.every[id] || PLANTS[id].water;
  const log = (j.log[id] || []).filter(e => e.k === 'water').sort((a,b) => b.t.localeCompare(a.t));
  if (!log.length) return { state: 'empty', every, last: null, days: null, due: null };
  const last = new Date(log[0].t);
  const days = Math.floor((Date.now() - last.getTime()) / DAY);
  const left = every - days;
  return { state: left < 0 ? 'thirsty' : 'ok', every, last, days, left };
}
const dayWord = (n) => n === 1 ? '1 day' : `${n} days`;
function statusText(w) {
  if (w.state === 'empty') return { main: 'Not logged yet', sub: 'Tap Water after you water it' };
  const ago = w.days === 0 ? 'today' : w.days === 1 ? 'yesterday' : `${w.days} days ago`;
  if (w.state === 'thirsty') return { main: 'Thirsty', sub: `last watered ${ago} · ${dayWord(-w.left)} overdue` };
  return { main: `Watered ${ago}`, sub: w.left === 0 ? 'water today' : `next in ${dayWord(w.left)}` };
}

/* ===================== PAGES ===================== */
const stage = document.getElementById('stage');
const pages = stage.querySelectorAll('.page');
let current = 'landing';
let currentPlant = null;

function showPage(name, opts = {}) {
  if (name === current && name !== 'plant') return;
  const prev = stage.querySelector('.page.active');
  if (prev) { prev.classList.add('leaving'); setTimeout(() => prev.classList.remove('leaving'), 450); }
  pages.forEach(p => {
    const active = p.dataset.name === name;
    p.classList.toggle('active', active);
    if (active) p.scrollTop = 0;
  });
  current = name;
  if (name === 'memorial') renderMemorial();
  if (name === 'landing') refreshStatus();
  const hash = name === 'plant' ? '#' + currentPlant : name === 'landing' ? '#' : '#' + name;
  if (!opts.silent) history.pushState({ page: name, plant: currentPlant }, '', hash);
}
function openPlant(id) {
  if (!PLANTS[id]) return;
  currentPlant = id;
  renderPlant(id);
  showPage('plant');
}
function go(target) {
  if (target === 'landing' || target === 'memorial') showPage(target);
  else openPlant(target);
}
window.addEventListener('popstate', (e) => {
  const s = e.state;
  if (!s || s.page === 'landing') { showPage('landing', { silent: true }); return; }
  if (s.page === 'plant' && s.plant) { currentPlant = s.plant; renderPlant(s.plant); showPage('plant', { silent: true }); return; }
  showPage(s.page, { silent: true });
});

function ecoRows() {
  const alive = ORDER.filter(id => !isDead(id));
  return alive.map(id => {
    const p = PLANTS[id];
    return `<div class="row" data-go="${id}" data-plant="${id}">
      <img class="bullet leaf-img" src="leaf.png" alt="">
      <div class="text"><span class="sp">${esc(p.latin)}</span> <span class="cn">(${esc(p.common)})</span></div>
      <div class="status"></div>
    </div>`;
  }).join('') || '<p class="memorial-empty">Everything has moved to the memorial.</p>';
}
function ecoHTML() {
  const rows = ecoRows();
  return `<button class="ecosystem" data-eco-toggle aria-expanded="false" aria-label="Show the full ecosystem list">
      <span class="label">Ecosystem</span>
      <img class="leaf leaf-img" src="leaf.png" alt="">
      <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6 l5 5 l5 -5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="list-section"><div class="list-inner"><h2>The full ecosystem</h2>${rows}</div></div>`;
}
function renderEco() {
  stage.querySelectorAll('[data-eco]').forEach(w => { const open = w.classList.contains('open'); w.innerHTML = ecoHTML(); w.classList.toggle('open', open); });
  refreshStatus();
}
function toggleEco(wrap, force) {
  const open = force === undefined ? !wrap.classList.contains('open') : force;
  wrap.classList.toggle('open', open);
  wrap.querySelector('.ecosystem').setAttribute('aria-expanded', open);
  if (open) setTimeout(() => wrap.querySelector('.ecosystem').scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
}

/* ===================== LANDING: LIST + STATUS ===================== */
function refreshStatus() {
  let thirsty = [];
  ORDER.forEach(id => {
    if (isDead(id)) return;
    const w = waterInfo(id);
    const isT = w.state === 'thirsty';
    if (isT) thirsty.push(PLANTS[id].name);
    stage.querySelectorAll(`.slide[data-plant="${id}"]`).forEach(s => s.classList.toggle('thirsty', isT));
    stage.querySelectorAll(`.row[data-plant="${id}"]`).forEach(row => {
      row.classList.toggle('thirsty', isT);
      const st = row.querySelector('.status');
      if (w.state === 'empty') st.innerHTML = '';
      else st.innerHTML = `<svg><use href="#${isT ? 'drop-fill' : 'drop'}"/></svg>${isT ? 'thirsty' : (w.days === 0 ? 'today' : w.days + ' d')}`;
    });
  });
  const t = document.getElementById('today');
  t.classList.toggle('on', thirsty.length > 0);
  if (thirsty.length) {
    document.getElementById('today-text').textContent =
      thirsty.length === 1 ? `${thirsty[0]} is thirsty` : `${thirsty.length} plants are thirsty`;
  }
}

/* ===================== CAROUSEL (infinite, rebuildable) ===================== */
const carousel = (function () {
  const car = document.getElementById('carousel');
  let slides = [], N = 0, jumping = false, stopTimer;

  function slideHTML(id) {
    const p = PLANTS[id];
    return `<div class="slide ${id}" data-go="${id}" data-plant="${id}">
      <div class="card-stage"><img class="photo" src="photos/${id}.webp" alt="${esc(p.name)}" loading="lazy"><div class="oval"></div>
        <span class="badge"><svg><use href="#drop-fill"/></svg>thirsty</span></div>
      <p class="name${p.name.length > 9 ? ' long' : ''}">${esc(p.name)}</p>
      <p class="origin">${esc(p.origin)}</p>
    </div>`;
  }
  function build() {
    const alive = ORDER.filter(id => !isDead(id));
    N = alive.length;
    if (!N) { car.innerHTML = '<p class="carousel-empty">The garden is empty.</p>'; slides = []; return; }
    // [copyA | originals | copyB]
    car.innerHTML = alive.map(slideHTML).join('') + alive.map(slideHTML).join('') + alive.map(slideHTML).join('');
    slides = Array.from(car.querySelectorAll('.slide'));
    requestAnimationFrame(() => { centerOnIndex(N, 'auto'); requestAnimationFrame(update); });
  }
  let startX = 0, moved = false;
  car.addEventListener('pointerdown', (e) => { startX = e.clientX; moved = false; });
  car.addEventListener('pointermove', (e) => { if (Math.abs(e.clientX - startX) > 6) moved = true; });
  car.addEventListener('click', (e) => { if (moved) { e.preventDefault(); e.stopPropagation(); } }, true);

  function getStride() { return slides.length < 2 ? (slides[0]?.offsetWidth || 0) : slides[1].offsetLeft - slides[0].offsetLeft; }
  function centerOnIndex(idx, behavior) {
    const target = slides[idx]; if (!target) return;
    const carRect = car.getBoundingClientRect();
    car.scrollTo({ left: target.offsetLeft + target.offsetWidth / 2 - carRect.width / 2, behavior: behavior || 'auto' });
  }
  function update() {
    const carRect = car.getBoundingClientRect();
    const center = carRect.left + carRect.width / 2;
    slides.forEach(s => {
      const r = s.getBoundingClientRect();
      const ratio = Math.abs(center - (r.left + r.width / 2)) / r.width;
      s.style.opacity = (ratio < 0.5 ? 1 : Math.max(0, 1 - (ratio - 0.5) * 0.9)).toFixed(3);
    });
  }
  function checkLoop() {
    if (jumping || !N) return;
    const stride = getStride(); if (!stride) return;
    const section = N * stride, cur = car.scrollLeft;
    if (cur < section * 0.5) silentJump(cur + section);
    else if (cur > section * 2 + section * 0.5) silentJump(cur - section);
  }
  function silentJump(left) {
    jumping = true;
    const prev = car.style.scrollSnapType;
    car.style.scrollSnapType = 'none';
    car.scrollLeft = left;
    requestAnimationFrame(() => { car.style.scrollSnapType = prev || 'x mandatory'; jumping = false; });
  }
  car.addEventListener('scroll', () => { update(); clearTimeout(stopTimer); stopTimer = setTimeout(checkLoop, 120); }, { passive: true });
  window.addEventListener('resize', () => { centerOnIndex(N, 'auto'); update(); });
  return { build };
})();

/* ===================== FIELD GUIDE ===================== */
const CARE_ICON = {
  'best placement in the house': 'window', 'watering habits': 'drop', 'repotting': 'pot',
  'spraying & humidity': 'mist', 'best care tips': 'feed', 'interesting facts': 'magnify'
};
function renderPlant(id, dir) {
  const p = PLANTS[id];
  const page = document.getElementById('page-plant');
  const w = waterInfo(id);
  const anim = dir > 0 ? ' from-right' : dir < 0 ? ' from-left' : '';

  const sections = p.sections.map(s => {
    const fig = p.figures.find(f => f.n === s.fig);
    const img = s.fig ? `<figure><img src="figs/${id}-${s.fig}.png" alt="${esc(s.heading)}" loading="lazy"></figure>` : '';
    const body = s.text ? `<p>${esc(s.text)}</p>`
      : s.callouts.length ? `<ul class="callouts">${s.callouts.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : '';
    const cap = fig ? `<p class="figcap"><b>Fig. ${fig.n}</b> ${esc(fig.caption)}</p>` : '';
    return `<section class="figblock">${img}<div class="body"><h3 class="sec-h">${esc(s.heading)}</h3>${body}${cap}</div></section>`;
  }).join('');

  const care = p.care.map((c, i) => {
    const body = c.text ? `<p>${esc(c.text)}</p>` : `<ul>${c.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
    const wide = (p.care.length % 2 === 1 && i === p.care.length - 1) ? ' wide' : '';
    return `<div class="care-card${wide}"><h4>${esc(c.heading)}</h4>${body}</div>`;
  }).join('');


  page.innerHTML = `
    <div class="topbar" id="topbar">
      <button class="ib back" data-go="landing" aria-label="Back to The Shire">‹</button>
      <span class="topname">${esc(p.name)}</span>
      <div class="grp">
        <button class="ib eco" data-head-eco aria-label="All plants" aria-expanded="false"><img class="leaf-img" src="leaf.png" alt=""><svg class="chev" viewBox="0 0 16 16"><path d="M3 6 l5 5 l5 -5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="ib church" data-kill="${id}" aria-label="Mark as deceased"><svg><use href="#church-icon"/></svg></button>
      </div>
      <div class="head-eco"><div class="list-inner"><h2>The full ecosystem</h2>${ecoRows()}</div></div>
    </div>
    <div class="pp${anim}">
    <div class="hero-photo">
      <div class="mood"></div>
      <button class="nav-arrow prev stamp round" data-nav="-1" aria-label="Previous plant">‹</button>
      <img class="plant-photo" src="photos/${id}.webp" alt="${esc(p.latin)}">
      <button class="nav-arrow next stamp round" data-nav="1" aria-label="Next plant">›</button>
      <div><button class="zoom-hint stamp light" data-zoom><svg><use href="#magnify"/></svg>Open the botanical plate</button></div>
    </div>
    <article class="guide">
      <h1 class="latin">${esc(p.latin)}</h1>
      <p class="common">${esc(p.common)}</p>

      <section class="journal" id="journal"></section>

      <table class="tax">
        <tr><td>Family</td><td>${esc(p.taxonomy.family)}</td></tr>
        <tr><td>Genus</td><td>${esc(p.taxonomy.genus)}</td></tr>
        <tr><td>Species</td><td>${esc(p.taxonomy.species)}</td></tr>
        <tr><td>Common name</td><td class="rm">${esc(p.taxonomy.common)}</td></tr>
      </table>

      <section class="origin">
        <img src="figs/${id}-map.png" alt="${esc(p.origin_label)}" loading="lazy">
        <div><h3 class="sec-h">${esc(p.origin_heading)}</h3><p>${esc(p.origin_text)}</p></div>
      </section>

      ${sections}

      <h2 class="care-title">Care</h2>
      <div class="care-grid">${care}</div>

      <aside class="note"><span class="lbl">Note</span><p>${esc(p.note)}</p></aside>
    </article>
    <div class="eco-wrap" data-eco></div>
    </div>`;
  renderJournal(id);
  page.querySelector('[data-eco]').innerHTML = ecoHTML();
  refreshStatus();
}

/* ===================== PREV / NEXT ===================== */
function navPlant(dir) {
  const alive = ORDER.filter(id => !isDead(id));
  if (!alive.length) return;
  let i = alive.indexOf(currentPlant); if (i < 0) i = 0;
  const next = alive[(i + dir + alive.length) % alive.length];
  currentPlant = next;
  renderPlant(next, dir);
  document.getElementById('page-plant').scrollTop = 0;
  history.pushState({ page: 'plant', plant: next }, '', '#' + next);
}
(function swipe() {
  const page = document.getElementById('page-plant');
  let sx = 0, sy = 0, active = false;
  page.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.j-actions, .j-head, .nav-arrow, .head-eco, .ecosystem')) { active = false; return; }
    sx = e.clientX; sy = e.clientY; active = true;
  });
  page.addEventListener('pointerup', (e) => {
    if (!active) return; active = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 64 && Math.abs(dy) < 48) navPlant(dx < 0 ? 1 : -1);
  });
  page.addEventListener('pointercancel', () => { active = false; });
  window.addEventListener('keydown', (e) => {
    if (current !== 'plant' || document.getElementById('zoom').classList.contains('on')) return;
    if (e.key === 'ArrowRight') navPlant(1);
    if (e.key === 'ArrowLeft') navPlant(-1);
  });
})();

/* ===================== JOURNAL ===================== */
const KINDS = { water: ['Water', 'drop'], mist: ['Mist', 'mist'], feed: ['Feed', 'feed'], repot: ['Repot', 'pot'] };
let journalExpanded = false;
function renderJournal(id) {
  const el = document.getElementById('journal'); if (!el) return;
  const j = getJournal();
  const w = waterInfo(id);
  const st = statusText(w);
  const log = (j.log[id] || []).slice().sort((a,b) => b.t.localeCompare(a.t));
  const shown = journalExpanded ? log : log.slice(0, 5);
  const rows = shown.map(e => `<li><svg><use href="#${KINDS[e.k][1]}"/></svg>${KINDS[e.k][0]}<span class="d">${fmtDate(e.t)}</span><button class="x" data-del="${e.t}" aria-label="Remove entry">×</button></li>`).join('');
  const more = log.length > 5 && !journalExpanded ? `<li class="more" data-more>show all ${log.length}</li>` : '';
  el.innerHTML = `
    <div class="j-head"><h3 class="sec-h">Journal</h3>
      <span class="int">every <button data-int="-1" aria-label="Fewer days">−</button>${w.every} days<button data-int="1" aria-label="More days">+</button></span></div>
    <div class="j-status ${w.state}"><svg class="drop"><use href="#${w.state === 'empty' ? 'drop' : 'drop-fill'}"/></svg>
      <div><strong>${st.main}</strong><span>${st.sub}</span></div></div>
    <div class="j-actions">${Object.entries(KINDS).map(([k,[lbl,ic]]) => `<button class="stamp" data-log="${k}"><svg><use href="#${ic}"/></svg>${lbl}</button>`).join('')}</div>
    ${log.length ? `<ul class="j-log">${rows}${more}</ul>` : '<p class="j-empty">Nothing logged yet. Every tap is saved on this device.</p>'}`;
}
function logEvent(id, kind) {
  const j = getJournal();
  (j.log[id] = j.log[id] || []).push({ k: kind, t: new Date().toISOString() });
  setJournal(j); renderJournal(id);
}
function deleteEvent(id, t) {
  const j = getJournal();
  j.log[id] = (j.log[id] || []).filter(e => e.t !== t);
  setJournal(j); renderJournal(id);
}
function bumpInterval(id, d) {
  const j = getJournal();
  const cur = j.every[id] || PLANTS[id].water;
  j.every[id] = Math.min(60, Math.max(1, cur + d));
  setJournal(j); renderJournal(id);
}

/* ===================== MEMORIAL ===================== */
function askKill(id) {
  const p = PLANTS[id];
  document.getElementById('sheet-title').textContent = `Mark ${p.latin} as deceased?`;
  const sheet = document.getElementById('sheet');
  sheet.classList.add('on');
  sheet.dataset.id = id;
}
function killPlant(id) {
  const p = PLANTS[id];
  const dead = getDead();
  if (!dead.some(d => d.id === id)) {
    dead.push({ id, species: p.latin, deceasedAt: new Date().toISOString() });
    setDead(dead);
  }
  carousel.build(); renderEco();
  showPage('memorial');
}
function restorePlant(id) {
  setDead(getDead().filter(d => d.id !== id));
  carousel.build(); renderEco(); renderMemorial();
}
function renderMemorial() {
  const c = document.getElementById('memorial-list');
  const dead = getDead();
  if (!dead.length) { c.innerHTML = '<p class="memorial-empty">No plants have passed yet. May they live long and prosper.</p>'; return; }
  c.innerHTML = dead.map(d => `
    <div class="memorial-card">
      <div class="memorial-thumb" style="background-image:url('photos/${d.id}.webp')"></div>
      <p class="memorial-name">${esc(d.species)}</p>
      <p class="memorial-date">Deceased ${fmtDate(d.deceasedAt)}</p>
      <button class="memorial-restore" data-restore="${d.id}">it came back to life</button>
    </div>`).join('');
}

/* ===================== ZOOM VIEWER ===================== */
const zoom = (function () {
  const box = document.getElementById('zoom'), img = document.getElementById('zoom-img');
  let s = 1, tx = 0, ty = 0, pts = new Map(), lastDist = 0, lastMid = null, lastTap = 0;
  const apply = () => { img.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`; };
  function clamp() {
    const W = box.clientWidth, H = box.clientHeight, iw = img.clientWidth * s, ih = img.clientHeight * s;
    tx = iw <= W ? (W - iw) / 2 : Math.min(0, Math.max(W - iw, tx));
    ty = ih <= H ? Math.max(0, (H - ih) / 2) : Math.min(0, Math.max(H - ih, ty));
  }
  function open(src) {
    img.src = src; s = 1; tx = 0; ty = 0; box.classList.add('on');
    img.onload = () => { clamp(); apply(); };
    clamp(); apply();
  }
  function close() { box.classList.remove('on'); }
  function zoomAt(x, y, factor) {
    const ns = Math.min(4, Math.max(1, s * factor));
    tx = x - (x - tx) * (ns / s); ty = y - (y - ty) * (ns / s); s = ns; clamp(); apply();
  }
  box.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.close')) return;
    box.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; lastDist = Math.hypot(a.x - b.x, a.y - b.y); lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
    if (pts.size === 1) {
      const now = Date.now();
      if (now - lastTap < 300) { const r = box.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, s > 1.5 ? 1 / s : 2.5); lastTap = 0; }
      else lastTap = now;
    }
  });
  box.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { tx += e.clientX - prev.x; ty += e.clientY - prev.y; clamp(); apply(); }
    else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const r = box.getBoundingClientRect();
      if (lastDist) zoomAt(mid.x - r.left, mid.y - r.top, dist / lastDist);
      if (lastMid) { tx += mid.x - lastMid.x; ty += mid.y - lastMid.y; clamp(); apply(); }
      lastDist = dist; lastMid = mid;
    }
  });
  const up = (e) => { pts.delete(e.pointerId); lastDist = 0; lastMid = null; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  box.addEventListener('wheel', (e) => { e.preventDefault(); const r = box.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.9); }, { passive: false });
  box.querySelector('.close').addEventListener('click', close);
  return { open, close };
})();

/* ===================== EVENTS ===================== */
stage.addEventListener('click', (e) => {
  const t = (sel) => e.target.closest(sel);
  let b;
  if ((b = t('[data-kill]'))) { e.preventDefault(); askKill(b.dataset.kill); return; }
  if ((b = t('[data-restore]'))) { e.preventDefault(); restorePlant(b.dataset.restore); return; }
  if ((b = t('[data-log]'))) { e.preventDefault(); logEvent(currentPlant, b.dataset.log); return; }
  if ((b = t('[data-del]'))) { e.preventDefault(); deleteEvent(currentPlant, b.dataset.del); return; }
  if ((b = t('[data-int]'))) { e.preventDefault(); bumpInterval(currentPlant, +b.dataset.int); return; }
  if ((b = t('[data-more]'))) { e.preventDefault(); journalExpanded = true; renderJournal(currentPlant); return; }
  if ((b = t('[data-zoom]'))) { e.preventDefault(); zoom.open(PLANTS[currentPlant].frameSrc); return; }
  if ((b = t('[data-eco-toggle]'))) { e.preventDefault(); toggleEco(b.closest('[data-eco]')); return; }
  if ((b = t('[data-nav]'))) { e.preventDefault(); navPlant(+b.dataset.nav); return; }
  if ((b = t('[data-head-eco]'))) { e.preventDefault(); const tb = b.closest('.topbar'); const o = tb.classList.toggle('open'); b.setAttribute('aria-expanded', o); return; }
  if ((b = t('[data-eco-open]'))) { e.preventDefault(); toggleEco(document.getElementById(b.dataset.ecoOpen), true); return; }
  if ((b = t('[data-go]'))) { e.preventDefault(); go(b.dataset.go); }
});
document.getElementById('sheet-cancel').addEventListener('click', () => document.getElementById('sheet').classList.remove('on'));
document.getElementById('sheet-go').addEventListener('click', () => {
  const sheet = document.getElementById('sheet'); sheet.classList.remove('on'); killPlant(sheet.dataset.id);
});
document.getElementById('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') e.target.classList.remove('on'); });

/* ===================== INIT ===================== */
renderEco();
carousel.build();
refreshStatus();
journalExpanded = false;

// Deep link: #fittonia / #memorial
(function initRoute() {
  const h = location.hash.replace('#', '');
  history.replaceState({ page: 'landing', plant: null }, '', location.pathname);
  if (h && (PLANTS[h] || h === 'memorial')) go(h);
})();

// Loader: once per session
(function loader() {
  const el = document.getElementById('loader');
  let seen = false; try { seen = sessionStorage.getItem('shire-seen') === '1'; } catch {}
  if (seen) { el.remove(); return; }
  try { sessionStorage.setItem('shire-seen', '1'); } catch {}
  const ready = (document.fonts ? document.fonts.ready : Promise.resolve());
  Promise.all([ready, new Promise(r => setTimeout(r, 1500))]).then(() => {
    el.classList.add('off'); setTimeout(() => el.remove(), 600);
  });
})();

// Installable + offline
if (false) {
  window.addEventListener('load', () => {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    let refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !refreshed) { refreshed = true; location.reload(); } });
  });
}
