<!DOCTYPE html>
<meta charset="utf-8">
<title>Money Garden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#0A0D12; --surface:#131822; --surface2:#1B2230; --line:rgba(255,255,255,.09);
  --text:#F2F0E9; --muted:#9AA3AF; --faint:#5F6975;
  --grow:#3DDCC0; --grow2:#5ED9FF; --grow-ink:#0A0D12; --grow-soft:rgba(61,220,192,.16);
  --heat:#FF6B57; --heat-soft:rgba(255,107,87,.16);
  --sky:#6FA8FF; --sky-soft:rgba(111,168,255,.16);
  --sun:#FFC466; --sun-soft:rgba(255,196,102,.16);
  --stable:#B9C2CF;
  --blob-a:#FF6B57; --blob-b:#3DDCC0; --blob-c:#4C6FFF; --blob-op:.55;
  --shadow:0 20px 60px rgba(0,0,0,.45);
  --r:22px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E4ECE8; --line:rgba(20,32,30,.10);
    --text:#14201E; --muted:#54635F; --faint:#8A9793;
    --grow:#0E9F86; --grow2:#1592A8; --grow-ink:#FFFFFF; --grow-soft:rgba(14,159,134,.14);
    --heat:#E0523F; --heat-soft:rgba(224,82,63,.14);
    --sky:#2F6FE0; --sky-soft:rgba(47,111,224,.14);
    --sun:#C98A12; --sun-soft:rgba(201,138,18,.16);
    --stable:#5E6C78;
    --blob-a:#FFB3A6; --blob-b:#9EE8D9; --blob-c:#B9C8FF; --blob-op:.75;
    --shadow:0 20px 50px rgba(20,32,30,.12);
  }
}
:root[data-theme="light"]{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E4ECE8; --line:rgba(20,32,30,.10);
  --text:#14201E; --muted:#54635F; --faint:#8A9793;
  --grow:#0E9F86; --grow2:#1592A8; --grow-ink:#FFFFFF; --grow-soft:rgba(14,159,134,.14);
  --heat:#E0523F; --heat-soft:rgba(224,82,63,.14);
  --sky:#2F6FE0; --sky-soft:rgba(47,111,224,.14);
  --sun:#C98A12; --sun-soft:rgba(201,138,18,.16);
  --stable:#5E6C78;
  --blob-a:#FFB3A6; --blob-b:#9EE8D9; --blob-c:#B9C8FF; --blob-op:.75;
  --shadow:0 20px 50px rgba(20,32,30,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Nunito Sans",system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:blur(60px) saturate(1.1);opacity:var(--blob-op);pointer-events:none;transform:scale(1.15)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 60px}
.serif{font-family:Fraunces,Georgia,serif}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 .9em}
p:last-child{margin-bottom:0}
b{font-weight:800}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:26px;font-weight:700}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:"Nunito Sans",sans-serif;font-weight:600;letter-spacing:.02em}
.stats{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700}
.chip svg{width:14px;height:14px}
.chip.sunc{color:var(--sun)}
.chip.streak{color:var(--heat)}
.tools{display:flex;gap:8px;margin:0 0 20px}
.tool{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .15s,border-color .15s}
.tool:hover{transform:translateY(-1px);border-color:var(--sky)}
.tool .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sky-soft);color:var(--sky);flex:none}
.tool.plan .ic{background:var(--sun-soft);color:var(--sun)}
.tool b{display:block;font-size:14px}
.tool span{font-size:12px;color:var(--muted)}

/* welcome */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 20px;margin-bottom:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--grow-soft),transparent 70%)}
.hero h2{font-size:30px;line-height:1.15;margin-bottom:10px}
.hero p{color:var(--muted);font-size:15px;max-width:42ch}
.hero .cta{margin-top:14px}

/* map */
.map{position:relative;margin:0 auto}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map .seg{fill:none;stroke:var(--faint);stroke-width:3;stroke-dasharray:2 10;stroke-linecap:round;opacity:.7}
.map .seg.done{stroke:var(--grow);stroke-dasharray:none;opacity:.9}
.node{position:absolute;width:0;height:0;display:flex;flex-direction:column;align-items:center;transform:translate(0,-38px)}
.node button.pot{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line);color:var(--faint);transition:transform .2s,box-shadow .2s;position:relative}
.node button.pot svg{width:42px;height:42px}
.node.done button.pot{background:var(--grow-soft);border-color:var(--grow);color:var(--grow)}
.node.active button.pot{background:var(--surface);border-color:var(--sun);color:var(--sun);box-shadow:0 0 0 8px var(--sun-soft),0 0 40px rgba(255,196,102,.35)}
.node.active button.pot::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--sun);opacity:.35;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.node button.pot:hover:not(:disabled){transform:translateY(-3px)}
.node button.pot:disabled{cursor:not-allowed}
.node .lab{margin-top:10px;text-align:center;width:170px}
.node .lab b{display:block;font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:600}
.node .lab span{font-size:12px;color:var(--muted);display:block;line-height:1.35}
.node .lab .sc{display:inline-block;margin-top:4px;font-size:11px;color:var(--grow);font-weight:800;letter-spacing:.04em}
.node.locked .lab b,.node.locked .lab span{color:var(--faint)}
.footnote{margin-top:22px;text-align:center;font-size:12px;color:var(--faint);max-width:44ch;margin-left:auto;margin-right:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:16px;font-weight:800;font-size:15px;letter-spacing:.01em;transition:transform .12s,opacity .15s,filter .15s}
.btn.primary{background:linear-gradient(135deg,var(--grow),var(--grow2));color:var(--grow-ink);box-shadow:0 8px 30px rgba(61,220,192,.25)}
.btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.primary:disabled{opacity:.35;box-shadow:none;transform:none;cursor:not-allowed}
.btn.ghost{background:var(--surface2);border:1px solid var(--line)}
.btn.block{width:100%}

/* lesson */
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-height:min(78vh,720px);display:flex;flex-direction:column;position:relative;overflow:hidden}
.ltop{display:flex;align-items:center;gap:12px;padding:16px 16px 6px}
.ltop .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:22px;line-height:1}
.ltop .x:hover{background:var(--surface2)}
.pbar{flex:1;height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--grow),var(--grow2));transition:width .4s cubic-bezier(.2,.7,.2,1)}
.ltop .cnt{font-size:12px;color:var(--muted);font-weight:700;min-width:46px;text-align:right}
.stage{flex:1;padding:14px 22px 22px;overflow-y:auto}
.stage .eyebrow{margin-bottom:8px}
.stage h2{font-size:26px;line-height:1.2;margin-bottom:14px}
.stage h2.q{font-size:22px;font-family:"Nunito Sans",sans-serif;font-weight:800;letter-spacing:0}
.body{font-size:16px;color:var(--text)}
.body p{max-width:60ch}
.tick{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--sun);vertical-align:baseline}
.tick.eth{color:var(--sky)} .tick.st{color:var(--stable)} .tick.hot{color:var(--heat)} .tick.g{color:var(--grow)}
.ex{margin:16px 0 4px;padding:14px 16px;border-radius:14px;background:var(--surface2);border-left:3px solid var(--sun);font-size:14.5px}
.ex.warn{border-left-color:var(--heat)} .ex.good{border-left-color:var(--grow)} .ex.info{border-left-color:var(--sky)}
.ex .ex-l{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:6px}
.ex p{margin-bottom:.6em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:14.5px}
.kv .k{color:var(--muted);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}
.tbl th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line)}
.tbl td.mono,.tbl td .mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px}
.tblwrap{overflow-x:auto}
.fig{margin:14px 0 6px;padding:14px;border-radius:14px;background:var(--surface2)}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{font-size:12px;color:var(--muted);margin-top:8px}
.vol{display:grid;gap:8px;margin:14px 0 4px}
.vol div{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:10px;font-size:13.5px}
.vol i{display:block;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--grow),var(--heat))}
.vol span.mono{text-align:right;font-size:12px;color:var(--muted)}
ol.steps{padding-left:0;margin:12px 0;list-style:none;counter-reset:s}
ol.steps li{position:relative;padding-left:38px;margin-bottom:10px;counter-increment:s;font-size:15px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--grow-soft);color:var(--grow);font-weight:800;font-size:13px;display:grid;place-items:center;font-family:"JetBrains Mono",monospace}

/* options */
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface2);border:2px solid var(--line);font-weight:600;font-size:15px;line-height:1.4;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt.sel{border-color:var(--sky);background:var(--sky-soft)}
.opt.ok{border-color:var(--grow);background:var(--grow-soft)}
.opt.bad{border-color:var(--heat);background:var(--heat-soft)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{text-align:center;font-weight:800;font-size:17px;padding:20px}
.stmt{font-size:20px;font-weight:700;padding:18px 20px;border-radius:16px;background:var(--surface2);margin:8px 0 18px;line-height:1.4;font-family:Fraunces,Georgia,serif}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{min-height:62px;display:flex;align-items:center;font-size:14px}
.match .opt.matched{opacity:.45;border-color:var(--grow);background:var(--grow-soft)}
.match .opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.seq{min-height:64px;padding:10px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.seq .ph{color:var(--faint);font-size:13px;align-self:center;padding:8px 4px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{padding:10px 14px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);font-weight:700;font-size:14px;line-height:1.3;text-align:left;display:flex;gap:8px;align-items:center}
.chipbtn .n{width:22px;height:22px;border-radius:50%;background:var(--sky-soft);color:var(--sky);display:grid;place-items:center;font-size:12px;font-family:"JetBrains Mono",monospace;flex:none}
.chipbtn:hover{border-color:var(--sky)}
.chipbtn.ok{border-color:var(--grow)} .chipbtn.bad{border-color:var(--heat)}
.slider{margin-top:10px}
.slider .val{font-family:Fraunces,Georgia,serif;font-size:54px;font-weight:600;line-height:1;margin:6px 0 14px;color:var(--sun)}
.slider .val small{font-size:22px;color:var(--muted);font-family:"Nunito Sans",sans-serif;font-weight:700;margin-left:4px}
input[type=range]{width:100%;accent-color:var(--grow);height:32px}
.slider .rng{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:"JetBrains Mono",monospace}

/* footer of lesson */
.foot{padding:14px 22px 20px;border-top:1px solid var(--line);background:var(--surface)}
.fb{position:absolute;left:0;right:0;bottom:0;padding:18px 22px 20px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);background:var(--surface2);border-top:2px solid var(--line)}
.fb.show{transform:none}
.fb.ok{border-top-color:var(--grow)} .fb.ok .fbt{color:var(--grow)}
.fb.bad{border-top-color:var(--heat)} .fb.bad .fbt{color:var(--heat)}
.fb .fbt{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;margin-bottom:4px}
.fb .why{font-size:14.5px;color:var(--text);margin-bottom:14px;max-width:60ch}
.fb .btn.ok{background:var(--grow);color:var(--grow-ink)}
.fb .btn.bad{background:var(--heat);color:#fff}

/* complete */
.done-card{text-align:center;padding:36px 22px 26px}
.done-card .big{font-family:Fraunces,Georgia,serif;font-size:40px;font-weight:700;line-height:1.1;margin:14px 0 6px}
.done-card p{color:var(--muted)}
.score{display:flex;justify-content:center;gap:10px;margin:18px 0 22px}
.score div{padding:12px 16px;border-radius:14px;background:var(--surface2);min-width:110px}
.score b{display:block;font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700}
.score span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.take{text-align:left;margin:0 auto 22px;max-width:46ch;padding:16px 18px;border-radius:14px;background:var(--surface2)}
.take .eyebrow{margin-bottom:8px}
.take li{margin-bottom:6px;font-size:14.5px}
.take ul{margin:0;padding-left:18px}

/* overlay sheet */
.overlay{position:fixed;inset:0;z-index:5;background:rgba(5,8,12,.6);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;padding:0}
.overlay.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 22px 32px;box-shadow:var(--shadow)}
@media(min-width:640px){.overlay{align-items:center;padding:20px}.sheet{border-radius:24px}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet h2{font-size:26px}
.sheet .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.sheet .x:hover{background:var(--surface2)}
.dict dt{font-weight:800;margin-top:14px;display:flex;gap:8px;align-items:baseline}
.dict dt small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.dict dd{margin:2px 0 0;color:var(--muted);font-size:14.5px;max-width:60ch}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:inherit;margin-bottom:6px}
.frm{display:grid;gap:14px}
.frm label{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.frm label>*{min-width:0}
.frm label .lt{display:block}
.frm input[type=number],.frm select{width:100%;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:inherit;font-size:16px;font-family:"JetBrains Mono",monospace}
.frm .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg3 button{padding:10px 6px;min-width:0;border-radius:12px;line-height:1.3;border:2px solid var(--line);background:var(--surface2);font-weight:700;font-size:13px}
.seg3 button.on{border-color:var(--grow);background:var(--grow-soft);color:var(--text)}
.plan-out{margin-top:18px;display:grid;gap:12px}
.pcard{padding:16px 18px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.pcard .eyebrow{margin-bottom:6px}
.pcard .big{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:700;line-height:1.1}
.pcard .big small{font-size:14px;color:var(--muted);font-family:"Nunito Sans",sans-serif;font-weight:700}
.pcard p{font-size:14px;color:var(--muted);margin-top:6px}
.bar{height:10px;border-radius:999px;background:var(--surface);overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--grow));border-radius:999px}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.split div{padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center}
.split b{display:block;font-family:"JetBrains Mono",monospace;font-size:16px}
.split span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{font-size:12px;color:var(--faint);margin-top:14px}


/* tabs + arena */
.tabs{display:flex;gap:6px;padding:5px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:18px}
.tab{flex:1;padding:10px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
.tab.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.ratings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.rt{padding:12px 12px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rt .eyebrow{font-size:10px;margin-bottom:4px}
.rt b{display:block;font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;line-height:1.1}
.rt span{font-size:11px;color:var(--muted);font-weight:700}
.rt svg{width:100%;height:22px;margin-top:6px;display:block}
.modes{display:grid;gap:10px;margin-bottom:22px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.mode:hover:not(:disabled){transform:translateY(-1px);border-color:var(--sky)}
.mode:disabled{opacity:.6;cursor:default}
.mode .mi{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700}
.mode.daily .mi{background:var(--sun-soft);color:var(--sun)} .mode.rated .mi{background:var(--sky-soft);color:var(--sky)} .mode.rush .mi{background:var(--heat-soft);color:var(--heat)} .mode.season .mi{background:var(--grow-soft);color:var(--grow)}
.mode b{display:block;font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600}
.mode span{font-size:13px;color:var(--muted);display:block}
.mode .rec{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);white-space:nowrap}
.rdelta{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px}
.rdelta.up{color:var(--grow)} .rdelta.dn{color:var(--heat)}
.pzr{font-size:12px;color:var(--muted);font-weight:700;font-family:"JetBrains Mono",monospace}
.rushbar{display:flex;align-items:center;gap:10px;flex:1;justify-content:center;font-family:"JetBrains Mono",monospace;font-weight:700}
.rushbar .t{font-size:18px} .rushbar .t.low{color:var(--heat)}
.strikes{display:flex;gap:4px}
.strikes i{width:10px;height:10px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.strikes i.x{background:var(--heat);border-color:var(--heat)}
.rushscore{font-size:18px;color:var(--grow)}
/* season game */
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.px{font-family:"JetBrains Mono",monospace;font-size:34px;font-weight:700;line-height:1.05}
.chg{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;margin-top:2px}
.chg.up{color:var(--grow)} .chg.dn{color:var(--heat)}
.mood{text-align:right;min-width:120px}
.mood .g{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--grow),var(--sun),var(--heat));position:relative;margin-top:6px}
.mood .g i{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--text);border:3px solid var(--surface);transform:translateX(-8px)}
.mood span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.gchart{margin:6px 0 10px;padding:10px 8px 6px;border-radius:14px;background:var(--surface2)}
.gchart svg{width:100%;height:auto;display:block}
.news{padding:12px 14px;border-radius:14px;border:1px dashed var(--line);font-size:14px;margin-bottom:12px;color:var(--text)}
.news .eyebrow{margin-bottom:3px}
.hold{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.hold div{padding:10px;border-radius:12px;background:var(--surface2);text-align:center}
.hold b{display:block;font-family:"JetBrains Mono",monospace;font-size:15px}
.hold span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hold .vs{font-size:11px;color:var(--muted);font-weight:700}
.acts{display:grid;gap:8px}
.acts .row{display:grid;grid-template-columns:52px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.acts .row .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.acts .row.sell{grid-template-columns:52px repeat(3,minmax(0,1fr))}
.ab{padding:11px 4px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);font-weight:800;font-size:13px;font-family:"JetBrains Mono",monospace}
.ab:hover:not(:disabled){border-color:var(--grow)} .sell .ab:hover:not(:disabled){border-color:var(--heat)}
.ab:disabled{opacity:.35;cursor:not-allowed}
.acts .btn.ghost{margin-top:4px}
.res{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0}
.res td{padding:9px 6px;border-bottom:1px solid var(--line)}
.res td:last-child{text-align:right;font-family:"JetBrains Mono",monospace;font-weight:700}
.res tr.you td{color:var(--sun)}
.review{text-align:left;display:grid;gap:8px;margin:14px 0 18px}
.rv{padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:13.5px;border-left:3px solid var(--line)}
.rv.bad{border-left-color:var(--heat)} .rv.good{border-left-color:var(--grow)} .rv.meh{border-left-color:var(--sun)}
.rv b{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);display:block;margin-bottom:2px}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media(max-width:420px){
  .node .lab{width:150px}
  .stage h2{font-size:23px}
  .vol div{grid-template-columns:100px 1fr 46px}
}

<script>
/* ---------- ambient background ---------- */
(function(){
  const c=document.getElementById('bg'),x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
  let W,H;function size(){W=c.width=Math.max(320,innerWidth/3|0);H=c.height=Math.max(320,innerHeight/3|0)}size();addEventListener('resize',size);
  const blobs=[{v:'--blob-a',r:.55,s:.00011,o:0},{v:'--blob-b',r:.5,s:.00009,o:2.1},{v:'--blob-c',r:.6,s:.00007,o:4.2}];
  function draw(t){
    x.clearRect(0,0,W,H);
    x.fillStyle=css('--bg');x.fillRect(0,0,W,H);
    blobs.forEach((b,i)=>{
      const px=W*(.5+.38*Math.cos(t*b.s+b.o)), py=H*(.5+.36*Math.sin(t*b.s*1.3+b.o*.7));
      const rad=Math.min(W,H)*b.r;
      const g=x.createRadialGradient(px,py,0,px,py,rad);
      g.addColorStop(0,css(b.v));g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g;x.fillRect(0,0,W,H);
    });
    if(!reduce)requestAnimationFrame(draw);
  }
  draw(9000);
  if(reduce) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>draw(9000));
})();

/* ---------- content helpers ---------- */
const T=(title,body,o)=>Object.assign({type:'teach',title,body},o||{});
const MC=(q,opts,a,why)=>({type:'mc',q,opts,a,why});
const TF=(q,a,why)=>({type:'tf',q,a,why});
const MATCH=(pairs,why)=>({type:'match',pairs,why});
const ORDER=(q,items,why)=>({type:'order',q,items,why});
const SL=(q,min,max,step,unit,a,tol,why,prefix)=>({type:'slider',q,min,max,step,unit,a,tol,why,prefix});
const tk=(s,c)=>`<span class="tick ${c||''}">${s}</span>`;
const ex=(label,html,cls)=>`<div class="ex ${cls||''}"><span class="ex-l">${label}</span>${html}</div>`;

/* ---------- the units ---------- */
const UNITS=[
{ id:'soil', name:'The Soil', sub:'What crypto actually is', icon:'p1',
  takeaways:['A blockchain is a shared notebook thousands of computers keep identical copies of','A wallet is a keychain, not a purse — whoever holds the key owns the coins','Public address = your IBAN (share it). Seed phrase = master key (never share it)','Exchanges are shops that hold coins for you — convenient, but not your keys'],
  steps:[
  T('The arrows are the least important part',`<p>A price chart is just a diary of what people paid. Behind every token there is a <b>thing</b>: a system, a promise, or a bet. When the thing is good, the arrows eventually follow it. When the thing is empty, the arrows eventually find out.</p><p>This garden teaches you to see the thing first, and the price second. By the end you will know <b>what</b> to buy, <b>when</b>, and <b>how much</b> — with your own numbers.</p>${ex('How this works','<p>Short lessons, small quizzes. Wrong answers come back once at the end, like Duolingo. Sun points grow as you go. Nothing here needs real money.</p>','info')}`),
  T('What is money, anyway?',`<p>A €20 note is paper. It works because <b>everyone agrees</b> it works, and because one institution (the European Central Bank) decides how many exist.</p><p>Bitcoin, born in 2009, is the same agreement kept a different way: instead of a bank, a network of thousands of computers keeps the rulebook. And the rulebook is fixed — only <b>21 million</b> bitcoin will ever exist. Nobody can print more.</p>${ex('Real example','<p>In 2010 someone paid 10,000 '+tk('BTC')+' for two pizzas. Those coins would be worth roughly a billion dollars today. The point isn’t regret — it’s that agreement grew.</p>')}`),
  MC('Why does a €20 note have value?',['The paper is rare','Everyone agrees to accept it, and the ECB controls how many exist','Gold sits behind it in a vault','It says 20 on it'],1,'Money is a shared agreement plus controlled supply. Bitcoin copies exactly those two things, without a central bank.'),
  T('A blockchain is a shared notebook',`<p>Picture a village where everyone has an identical notebook. When Ana pays Ben one coin, <b>everyone</b> writes it down. If Ben tries to secretly edit his page, thousands of other notebooks disagree, so his edit is ignored.</p><p>That is a blockchain. A <b>block</b> is one page of transactions. The <b>chain</b> is the pages in order, each one stamped so it can’t be swapped.</p>${ex('Why it matters for your money','<p>Nobody can freeze it, reverse it, or quietly print more. That is the whole selling point — and also why mistakes can’t be undone.</p>','info')}`),
  TF('A blockchain is a company that stores your crypto for you.',false,'It’s not a company at all — it’s the shared notebook itself, kept by many computers. Companies (exchanges) can hold coins for you, but that’s a separate thing.'),
  T('A wallet is a keychain, not a purse',`<p>Your coins never sit <i>inside</i> your wallet. They sit in the notebook. Your wallet holds the <b>keys</b>:</p><div class="kv"><span class="k">Public address</span><span>Like your IBAN. Long code starting with <span class="mono">0x…</span> or <span class="mono">bc1…</span>. Safe to share — people send to it.</span><span class="k">Private key / seed phrase</span><span>12 or 24 words. Like your card, PIN and signature in one. Whoever has them owns the coins. Never share, never type into a website.</span></div>${ex('Real names you’ll see','<p>Phone/browser wallets: MetaMask, Rabby, Phantom. Physical "hardware" wallets: Ledger, Trezor. Same idea, different safety levels.</p>')}`),
  MC('Which one is safe to share with anyone?',['Your seed phrase','Your private key','Your public address','Your exchange password'],2,'The public address is your IBAN — people need it to send you coins. Everything else unlocks your money.'),
  T('Coins vs tokens',`<p>A <b>coin</b> is the native money of a blockchain: ${tk('BTC')} on Bitcoin, ${tk('ETH','eth')} on Ethereum, ${tk('SOL','eth')} on Solana.</p><p>A <b>token</b> is something built <i>on top</i> of a chain — like an app on a phone. ${tk('USDC','st')} (a digital dollar) is a token that lives on Ethereum, on Base, on Solana. Thousands of tokens exist; most are apps nobody uses.</p>`),
  MATCH([['Blockchain','Shared notebook everyone keeps a copy of'],['Wallet','Keychain, not a purse'],['Seed phrase','12–24 word master key'],['Public address','Your IBAN'],['Token','An app built on top of a chain']],'These five words cover most of what people mean when they say "crypto".'),
  T('The exchange is the shop',`<p>An <b>exchange</b> is where euros become coins. You send money by bank transfer, they buy coins and hold them for you — like a bank account for crypto.</p><p>EU-regulated names: <b>Kraken, Coinbase, Bitpanda</b> (Vienna), <b>Bitvavo</b>. Easy, insured against their own mistakes, but not against their own collapse.</p>${ex('Real example — FTX, November 2022','<p>The world’s second-biggest exchange used customer money for its own bets and went bankrupt in a week. Customers lost access to everything held there. Its founder got 25 years.</p>','warn')}<p><b>Rule of thumb:</b> small amounts on an exchange are fine. Amounts you would hate to lose move to your own wallet, where you hold the keys.</p>`),
  MC('"Not your keys, not your coins" means…',['Crypto without a physical key is fake','If someone else holds the keys, they control the coins — not you','You need a key to log in','Only hardware wallets are real'],1,'On an exchange you hold an IOU, not the coins. Usually fine — until the shop fails.'),
]},
{ id:'seeds', name:'The Seeds', sub:'The real tokens you can buy', icon:'p2',
  takeaways:['Four kinds: Bitcoin, big smart-contract chains, stablecoins, everything else','BTC = digital gold (scarce, boring). ETH = the city everything runs on','Stablecoins are digital dollars — not risk-free (UST went from $1 to ~$0.10)','Price per coin means nothing alone. Market cap = price × supply = the size of the thing'],
  steps:[
  T('There are tens of thousands of tokens. You need four kinds.',`<ol class="steps"><li><b>Bitcoin</b> — digital gold. One job: be scarce.</li><li><b>Big smart-contract chains</b> — Ethereum, Solana. Cities where apps live.</li><li><b>Stablecoins</b> — digital dollars and euros.</li><li><b>Everything else</b> — altcoins and memecoins. Real projects and lottery tickets, mixed together.</li></ol><p>Beginners get into trouble in category 4 while thinking they are in category 1.</p>`),
  T('Bitcoin — digital gold',`<p>${tk('BTC')} is designed to be <b>scarce and boring</b>. 21 million cap, over 19.9 million already exist. New coins are issued every ~10 minutes as a reward to the computers keeping the notebook — and that reward <b>halves every four years</b> (2012, 2016, 2020, April 2024).</p><div class="tblwrap"><table class="tbl"><tr><th>Moment</th><th>Price (approx.)</th></tr><tr><td>Pizza day, 2010</td><td class="mono">~$0.004</td></tr><tr><td>Peak, Nov 2021</td><td class="mono">~$69,000</td></tr><tr><td>Bottom, Nov 2022</td><td class="mono">~$16,000</td></tr><tr><td>Crossed $100k, Dec 2024</td><td class="mono">$100,000+</td></tr></table></div><p>The lesson in that table: enormous long-term growth, with <b>brutal 50–80% drops</b> along the way. Both are normal for Bitcoin.</p>`),
  MC('What makes Bitcoin scarce?',['A company limits production','The rulebook caps supply at 21 million and every computer enforces it','Governments agreed on a limit','Mining gets too expensive'],1,'The cap is code that every participant runs. Changing it would need almost everyone to agree to make their own coins less scarce — which never happens.'),
  T('Ethereum — the city',`<p>${tk('ETH','eth')} is programmable money. It runs <b>smart contracts</b>: think vending machines. Put a coin in, the rules run automatically, no cashier, no bank hours. Lending, trading, insurance — the whole "DeFi" world is vending machines on Ethereum.</p><p>${tk('ETH','eth')} itself is the <b>fuel</b> ("gas") you pay to use the city. Since September 2022 the network is secured by <b>staking</b>: people lock ETH as a deposit and earn roughly 3–4% a year for keeping it honest.</p>${ex('Neighbours','<p>'+tk('SOL','eth')+' (Solana) is a faster, cheaper, younger city with a history of outages. "Layer 2s" like Base and Arbitrum are express lanes built on top of Ethereum with much lower fees.</p>','info')}<p>Peak ~$4,900 (Nov 2021), bottom ~$900 (Jun 2022). Same weather as Bitcoin, slightly wilder.</p>`),
  MC('On Ethereum, "gas" is…',['A memecoin','The small fee in ETH you pay to use the network','Energy used by miners','A type of wallet'],1,'Every action — sending, swapping, minting — costs a little ETH. On busy days it gets expensive, which is why Layer 2s exist.'),
  T('Stablecoins — digital dollars',`<p>${tk('USDC','st')}, ${tk('USDT','st')} and ${tk('EURC','st')} aim to always be worth exactly $1 or €1. A company holds one real dollar in reserve for each token. Useful for parking money without leaving crypto, earning yield, or sending money anywhere in seconds.</p>${ex('Real example — Terra UST, May 2022','<p>UST was an <i>algorithmic</i> stablecoin: no real dollars behind it, just a clever mechanism. The mechanism broke. $1 became ~$0.10 in days and about $40 billion evaporated. This "depeg" risk is exactly what Cork Protocol builds insurance for — you already know this story from the inside.</p>','warn')}<p><b>Rule:</b> stablecoin ≠ risk-free. Prefer ones backed by real cash and regulated in the EU (${tk('USDC','st')}, ${tk('EURC','st')} comply with MiCA; several EU exchanges dropped ${tk('USDT','st')} in 2025 for not complying).</p>`),
  TF('All stablecoins are backed 1:1 by real dollars in a bank.',false,'Some are (USDC). Some are backed by mixed assets (USDT). Some were backed by nothing but a mechanism (UST) — and collapsed. Always ask: what is behind the $1?'),
  T('Altcoins and memecoins',`<p><b>Altcoin</b> = any coin that isn’t Bitcoin. Some are real businesses with users and revenue (${tk('LINK','eth')}, ${tk('UNI','eth')}, ${tk('AAVE','eth')}). Most are not.</p><p><b>Memecoins</b> (${tk('DOGE','hot')}, ${tk('PEPE','hot')}, ${tk('SHIB','hot')}) are lottery tickets. Their value is attention, and attention moves on.</p>${ex('The uncomfortable statistic','<p>Most altcoins that peaked in 2021 are still down 90% or more and will never recover. Treat category 4 as <b>spending money</b>, not investing.</p>','warn')}`),
  T('A low price does not mean cheap',`<p>Price per coin means nothing on its own. What matters is <b>market cap = price × number of coins</b> — the size of the whole thing.</p><div class="tblwrap"><table class="tbl"><tr><th>Coin</th><th>Price</th><th>Supply</th><th>Size</th></tr><tr><td>A</td><td class="mono">€2.00</td><td class="mono">100 million</td><td class="mono">€200M</td></tr><tr><td>B</td><td class="mono">€0.01</td><td class="mono">500 billion</td><td class="mono">€5,000M</td></tr></table></div><p>Coin B looks "cheap" and is 25× bigger. ${tk('SHIB','hot')} costs a fraction of a cent because there are ~589 <i>trillion</i> of them.</p>${ex('Useful reflex','<p>When someone says "if X just reaches $1…", multiply by the supply. If the answer is bigger than Apple, it’s not reaching $1.</p>','good')}`),
  MC('Coin A costs €2 with 100M coins. Coin B costs €0.01 with 500B coins. Which is the bigger asset?',['Coin A — €2 is more than €0.01','Coin B — €5 billion vs €200 million','They’re the same size','Impossible to know'],1,'€0.01 × 500,000,000,000 = €5 billion. Price alone tells you nothing about size or "room to grow".'),
  MATCH([['BTC','Digital gold — scarce and boring'],['ETH','The city where apps run'],['USDC','A digital dollar, backed 1:1'],['SOL','Faster, younger city with outages'],['DOGE','A lottery ticket']],'Four categories, five examples. Everything you meet fits somewhere in here.'),
]},
{ id:'weather', name:'Reading the Weather', sub:'Why the arrows go up and down', icon:'p3',
  takeaways:['Price is only the last deal between a buyer and a seller — there is no "true" price','Bitcoin swings ±60–80% a year. A 30% drop in a week is weather, not a storm','Watch timeframe, % change, market cap and volume. Ignore the rest at first','Rates, regulation, collapses and hype move prices. You can’t predict them; you can size for them'],
  steps:[
  T('Why the price moves at all',`<p>There is no "true" price. A price is just the <b>last deal</b> between one buyer and one seller. More people wanting to buy than sell → it ticks up. The reverse → down.</p><p>Crypto trades 24/7, in every country, with no closing bell and a lot of emotional holders. So moves are bigger and faster than stocks. A 30% Bitcoin drop in a week is <b>weather</b>, not a storm.</p>`),
  T('Volatility is the size of the swing',`<p>Roughly how much each thing tends to move in a bad-to-good year:</p><div class="vol"><div><span>Savings account</span><i style="width:2%"></i><span class="mono">~0%</span></div><div><span>World stock index</span><i style="width:20%"></i><span class="mono">±20%</span></div><div><span>Bitcoin</span><i style="width:70%"></i><span class="mono">±70%</span></div><div><span>Altcoins</span><i style="width:95%"></i><span class="mono">±90%+</span></div></div><p>This is the single most useful number for deciding <b>how much</b> to hold: if you couldn’t sleep through the bar, you own too much of it.</p>`),
  MC('Bitcoin drops 20% in one week. The most accurate read is…',['Bitcoin is dying','Time to sell before it hits zero','Normal for this asset — the question is whether anything about the thing changed','Buy with borrowed money, it’s a discount'],2,'20% weeks happen several times a year. Check the thing (did the rules change? did a big player collapse?), not the arrow.'),
  T('Reading a chart: the four things that matter',`<div class="fig"><svg viewBox="0 0 320 120" role="img" aria-label="Candlestick chart"><line x1="0" y1="100" x2="320" y2="100" stroke="currentColor" opacity=".15"/><line x1="0" y1="60" x2="320" y2="60" stroke="currentColor" opacity=".1"/><line x1="0" y1="20" x2="320" y2="20" stroke="currentColor" opacity=".1"/>
  <g stroke-width="2"><line x1="30" y1="30" x2="30" y2="80" stroke="var(--heat)"/><rect x="21" y="40" width="18" height="30" fill="var(--heat)" rx="2"/>
  <line x1="70" y1="50" x2="70" y2="95" stroke="var(--heat)"/><rect x="61" y="60" width="18" height="25" fill="var(--heat)" rx="2"/>
  <line x1="110" y1="70" x2="110" y2="100" stroke="var(--grow)"/><rect x="101" y="75" width="18" height="18" fill="var(--grow)" rx="2"/>
  <line x1="150" y1="45" x2="150" y2="85" stroke="var(--grow)"/><rect x="141" y="50" width="18" height="28" fill="var(--grow)" rx="2"/>
  <line x1="190" y1="35" x2="190" y2="70" stroke="var(--grow)"/><rect x="181" y="40" width="18" height="22" fill="var(--grow)" rx="2"/>
  <line x1="230" y1="30" x2="230" y2="75" stroke="var(--heat)"/><rect x="221" y="38" width="18" height="24" fill="var(--heat)" rx="2"/>
  <line x1="270" y1="15" x2="270" y2="60" stroke="var(--grow)"/><rect x="261" y="20" width="18" height="30" fill="var(--grow)" rx="2"/></g>
  <text x="21" y="115" font-size="9" fill="currentColor" opacity=".6" font-family="JetBrains Mono, monospace">1 candle = 1 day (or hour, or week)</text></svg><div class="cap">A candle: the box is where the price opened and closed. Teal = closed higher than it opened. Coral = closed lower. The thin line is the day’s full range.</div></div><ol class="steps"><li><b>Timeframe.</b> A 1-day chart and a 1-year chart of the same coin tell opposite stories. Zoom out first.</li><li><b>% change, not €.</b> "Bitcoin fell $3,000" is less than 3%. "Coin fell €0.02" might be 40%.</li><li><b>Market cap.</b> Size of the thing (previous unit).</li><li><b>Volume.</b> How much actually traded. A price jump on tiny volume is a rumour, not a move.</li></ol><p>Ignore everything else on the screen for now. Really.</p>`),
  T('Seasons — the four-year rhythm',`<p>Historically Bitcoin has moved in rough <b>four-year cycles</b> around the halvings: a euphoric peak, a long cold winter, a slow spring.</p><div class="tblwrap"><table class="tbl"><tr><th>Peak</th><th>Then bottom</th><th>Drop</th></tr><tr><td>Dec 2013 <span class="mono">~$1,100</span></td><td>Jan 2015 <span class="mono">~$200</span></td><td class="mono">−80%</td></tr><tr><td>Dec 2017 <span class="mono">~$20,000</span></td><td>Dec 2018 <span class="mono">~$3,200</span></td><td class="mono">−84%</td></tr><tr><td>Nov 2021 <span class="mono">~$69,000</span></td><td>Nov 2022 <span class="mono">~$16,000</span></td><td class="mono">−77%</td></tr><tr><td>2025 <span class="mono">$120,000+</span></td><td>?</td><td>?</td></tr></table></div><p>This is not a law of nature and it may stop working. But one thing has held: <b>the best buys happened when everyone was bored</b>, and the worst when your taxi driver started mentioning Bitcoin.</p>`),
  TF('If a coin went up a lot this month, it will probably keep going up next month.',false,'Momentum exists, but it is not a plan — and it reverses without warning. The people who bought the Nov 2021 peak were all following momentum.'),
  T('The emotions gauge',`<p>There is a free, real tool called the <b>Fear & Greed Index</b> (alternative.me). It scores the crowd’s mood from 0 (extreme fear) to 100 (extreme greed).</p><div class="fig"><svg viewBox="0 0 320 44" role="img" aria-label="Fear to greed scale"><defs><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="var(--grow)"/><stop offset=".5" stop-color="var(--sun)"/><stop offset="1" stop-color="var(--heat)"/></linearGradient></defs><rect x="10" y="10" width="300" height="12" rx="6" fill="url(#fg)"/><text x="10" y="40" font-size="10" fill="currentColor" opacity=".7" font-family="Nunito Sans, sans-serif" font-weight="700">0 · Extreme fear — historically decent buys</text><text x="310" y="40" font-size="10" fill="currentColor" opacity=".7" text-anchor="end" font-family="Nunito Sans, sans-serif" font-weight="700">100 · Extreme greed — careful</text></svg></div><p>Use it backwards: when it is deep red with fear, your monthly buy is probably a good one. When it is bright greed and everyone is a genius, don’t increase your buys. <b>Your plan decides; your feelings don’t.</b></p>`),
  MC('Headline: "Bitcoin crashes 15% after ETF outflows." You buy monthly. Your action?',['Sell before it falls more','Skip this month’s buy','Make the same monthly buy as planned','Buy 5× the usual amount'],2,'A schedule exists precisely so headlines don’t run your money. Same amount, same day. Fear-days quietly lower your average price.'),
  T('What actually moves prices',`<div class="kv"><span class="k">Interest rates</span><span>Cheap money → people buy risky things. 2022 rate hikes → everything risky fell, crypto hardest.</span><span class="k">Regulation</span><span>Jan 2024: US approved spot Bitcoin ETFs → pension funds and banks could finally buy. Prices followed.</span><span class="k">Collapses & hacks</span><span>FTX, Terra, Mt. Gox. Fear spreads to everything, even the healthy things.</span><span class="k">Halvings</span><span>New supply drops by half; historically preceded the big runs.</span><span class="k">Hype</span><span>Memecoin summers, celebrity tweets. Fast up, faster down.</span></div><p>You cannot predict any of these. You can <b>size your holdings so none of them hurt</b>. That is the next two units.</p>`),
]},
{ id:'when', name:'When to Plant', sub:'Timing without guessing', icon:'p4',
  takeaways:['Nobody can time the bottom. Consistency is a skill; timing is not','Order: no expensive debt → 3–6 month cushion → only money you won’t need for 5+ years → then crypto','DCA = same amount, same day, every month. It removes the "when" question','A windfall gets split over 6–12 months, not dropped in at once'],
  steps:[
  T('The honest answer to "when"',`<p>Nobody knows the bottom. Not the analysts, not the YouTubers, not your colleague who got lucky in 2020. Perfect timing is not a skill you can learn — <b>consistency and sizing are</b>.</p><p>So "when" becomes a boring, powerful answer: <b>on a schedule, with money you won’t need for years.</b> The rest of this unit makes that concrete.</p>`),
  T('Before a single euro goes into crypto',`<ol class="steps"><li><b>No expensive debt.</b> Credit card or consumer loan at 10%+? Paying it off is a guaranteed 10% return. Nothing in crypto guarantees anything.</li><li><b>A cushion.</b> 3–6 months of living costs in a normal account (Tagesgeld). This is what stops you selling crypto at the bottom because the washing machine died.</li><li><b>Long-term money only.</b> Anything you might need within 5 years (flat deposit, wedding, tax bill) stays out.</li><li><b>Then</b> invest — and crypto is a slice of that, not all of it.</li></ol>${ex('Why the cushion comes first','<p>In 2022 the people forced to sell at −75% were the ones who needed the money. The people who could wait were fine by 2024. The cushion buys you the ability to wait.</p>','good')}`),
  ORDER('Put these in the right order:',['Pay off high-interest debt','Build a 3–6 month cushion','Decide what money is long-term (5+ years)','Start buying crypto on a schedule'],'Debt first (it’s a guaranteed loss otherwise), cushion second (so you never sell in panic), then decide the long-term pot, then schedule the buys.'),
  T('DCA — watering on a schedule',`<p><b>Dollar-cost averaging</b>: the same amount, the same day, every month, no matter the price. You automatically buy more coins when it’s cheap and fewer when it’s expensive.</p><div class="fig"><svg viewBox="0 0 320 130" role="img" aria-label="Lump sum at peak versus monthly buys"><line x1="0" y1="110" x2="320" y2="110" stroke="currentColor" opacity=".15"/><polyline fill="none" stroke="var(--muted)" stroke-width="2" points="20,14 45,44 70,55 95,48 120,45 145,55 170,63 195,80 220,75 245,79 270,80 295,79 315,84"/><circle cx="20" cy="14" r="5" fill="var(--heat)"/><text x="30" y="14" font-size="10" fill="var(--heat)" font-weight="700" font-family="Nunito Sans, sans-serif">All-in at the peak, $69k</text><g fill="var(--grow)"><circle cx="45" cy="44" r="3.5"/><circle cx="70" cy="55" r="3.5"/><circle cx="95" cy="48" r="3.5"/><circle cx="120" cy="45" r="3.5"/><circle cx="145" cy="55" r="3.5"/><circle cx="170" cy="63" r="3.5"/><circle cx="195" cy="80" r="3.5"/><circle cx="220" cy="75" r="3.5"/><circle cx="245" cy="79" r="3.5"/><circle cx="270" cy="80" r="3.5"/><circle cx="295" cy="79" r="3.5"/><circle cx="315" cy="84" r="3.5"/></g><line x1="40" y1="66" x2="320" y2="66" stroke="var(--grow)" stroke-dasharray="3 4"/><text x="318" y="62" font-size="10" fill="var(--grow)" font-weight="700" text-anchor="end" font-family="Nunito Sans, sans-serif">12 monthly buys, average ≈ $30k</text><text x="20" y="125" font-size="9" fill="currentColor" opacity=".6" font-family="JetBrains Mono, monospace">Nov 2021 → Nov 2022, Bitcoin, approximate</text></svg></div>${ex('Real example','<p>Put everything in at the Nov 2021 peak (~$69k) and a year later you were down ~75%. Spread the same money over the next 12 months and your average price was roughly $30k. By December 2024 (Bitcoin above $100k) the peak buyer was up ~45%. The monthly buyer was up over 3×.</p>','good')}<p>DCA doesn’t make you a genius. It <b>removes the need to be one</b>.</p>`),
  MC('The main benefit of buying monthly (DCA) is…',['You always get the lowest price','You never lose money','You stop needing to guess the right day','You pay lower fees'],2,'You will sometimes buy high and sometimes low. Over time that averages out — and you never have to face the question "is now the moment?"'),
  T('Lump sum vs monthly',`<p>Statistically, putting a lump sum in all at once wins slightly <i>on average</i>, because markets rise more often than they fall. But averages don’t pay your rent — and DCA wins on regret, sleep, and actually sticking to it.</p><p>If you earn a monthly salary, DCA is simply natural: the money arrives monthly anyway.</p>${ex('Windfall rule','<p>Bonus, gift, tax refund? Split the crypto portion into <b>6–12 monthly pieces</b>. If prices drop, you’re glad. If they rise, you still got most of it in.</p>','info')}`),
  T('The five-year test',`<p>Ask, for every euro: <b>"Could I need this in the next five years?"</b> If yes, it does not go into crypto. Not because it will crash — because it <i>might</i> crash exactly when you need it, and 2022 showed how that goes.</p><p>Flat deposit in two years? Savings account or short-term bond. Money you genuinely don’t need until 2031? Now we’re talking.</p>`),
  TF('"I’m saving for a flat deposit in two years — crypto is a good place for it."',false,'Two years is well inside the danger window. Twice in the last decade Bitcoin lost ~75% inside a year. That deposit belongs in a savings account.'),
  T('So, practically: when?',`<ol class="steps"><li>Pick a day. The 1st, right after salary lands, works.</li><li>On your exchange, set up a <b>recurring buy</b> (Kraken, Coinbase and Bitpanda all have it). Monthly. Fixed amount.</li><li>Don’t check the price on buy day. Don’t check it on other days either.</li><li>Look once a quarter. That’s the whole schedule.</li></ol><p>"When" is now answered forever: <b>the 1st of the month.</b> Next unit: how much.</p>`),
  MC('You receive a €3,000 bonus. Your plan says crypto is 10% of your investing. Sensible move?',['Put all €3,000 into Bitcoin today — it’s a bonus anyway','Put the €300 crypto share in over the next few months, the rest into your normal investments','Wait for the next crash to buy','Buy the coin that’s up most this week'],1,'The plan gives you the amount (10% = €300). The windfall rule gives you the timing (spread it). Nothing else needs deciding.'),
]},
{ id:'howmuch', name:'The Pot Size', sub:'How much, and in what', icon:'p5',
  takeaways:['Crypto is a small slice — commonly 1–10% of your investments; ≤5% to start','Slice × drop = your total pain. 5% slice × −80% = −4% overall. Survivable','Inside the slice: 70–90% BTC + ETH, the rest experiments you understand, 0% TikTok tips','Start with €25–50 a month. The first six months are for learning how it feels'],
  steps:[
  T('The size rule',`<p>Most financial planners treat crypto as a <b>small slice of your investments</b> — commonly <b>1–10%</b>, with 5% or less for beginners. Not 5% of your salary; 5% of the money you invest.</p><p>The logic is arithmetic, not opinion. An asset that can fall 80% should be small enough that an 80% fall on it is a bruise on the whole:</p><div class="kv"><span class="k">Formula</span><span><b>slice × drop = total pain</b></span><span class="k">5% slice</span><span>× −80% = <b>−4%</b> on everything. You shrug.</span><span class="k">50% slice</span><span>× −80% = <b>−40%</b> on everything. You sell at the bottom and hate crypto forever.</span></div>`),
  SL('You have €10,000 invested. You could stomach losing €800 of it in a bad year. Crypto can drop 80%. What is your maximum crypto slice?',0,50,1,'%',10,2,'€800 ÷ 80% = €1,000 = 10% of €10,000. Work backwards from the pain you can take — never forwards from the gain you hope for.'),
  T('Inside the slice: core and satellites',`<p>Once you know the slice, split it:</p><div class="kv"><span class="k">Core · 70–90%</span><span>${tk('BTC')} and ${tk('ETH','eth')}. The two that have survived every winter. Boring on purpose.</span><span class="k">Satellites · 10–30%</span><span>One to three things you actually understand — a project whose product you’ve used, or a stablecoin earning yield.</span><span class="k">Zero</span><span>Anything you heard about today. Anything promising guaranteed returns.</span></div>${ex('Example: €100 a month','<p>€50 '+tk('BTC')+' · €30 '+tk('ETH','eth')+' · €20 for one experiment (or parked in '+tk('USDC','st')+' until you find one). That’s a complete portfolio.</p>','good')}`),
  MC('Which €100 monthly split fits "core and satellites"?',['€100 into whichever coin is trending','€50 BTC · €30 ETH · €20 one project you understand','€20 BTC · €80 spread across 8 memecoins','€100 into a coin your friend says will 50×'],1,'Core first, one or two experiments at most. If you can’t explain what the satellite does in one sentence, it isn’t a satellite — it’s a ticket.'),
  T('The sleep test and the pain test',`<p><b>Sleep test:</b> before buying, finish this sentence honestly: <i>"If this halves tomorrow, I will ____."</i> If the answer is "panic and sell", buy half as much and ask again.</p><p><b>Pain test:</b> take the amount you’re about to hold, multiply by 0.2, and imagine your screen showing that number for a whole year. Still fine? That’s your size. Not fine? Smaller.</p>`),
  T('Starting tiny is the point',`<p><b>€25 a month is a real start.</b> The first six months aren’t about returns — they’re about learning how a −30% month <i>feels</i> when it’s your money, and discovering that you survive it.</p>${ex('Fees','<p>Simple buys on exchanges cost roughly 0.5–1.5%. Fine for €25+. Don’t buy €5 at a time; the fee eats the point.</p>','info')}<p>Once you’ve felt a full drop and didn’t sell, you’re allowed to raise the amount. Not before.</p>`),
  MC('You earn €3,000 net, have a 3-month cushion, and invest €400 a month. Sensible crypto amount to start?',['€400 — go all in','€200 — half and half','€20–40 a month, raise later if you sleep fine','€0 — crypto is a scam'],2,'5–10% of €400 is €20–40. Small, boring, sustainable. You can always raise it after you’ve lived through a drop.'),
  T('Sizing your experiments',`<p>A project you like: <b>max 1–2%</b> of all your investments. A memecoin: <b>the price of a night out</b>, and only if you’d laugh when it goes to zero.</p><p>Write one line when you buy anything: <i>date · amount · price · why</i>. If the "why" stops being true, sell. That single habit beats most trading strategies.</p>`),
  TF('"Because crypto can 10×, I should put in more so it actually makes a difference."',false,'Anything that can 10× can also do −90%. Size for the downside; the upside takes care of itself. A 5% slice that 10×es becomes 35% of your portfolio — that’s plenty of difference.'),
]},
{ id:'weeds', name:'Weeds & Pests', sub:'Where beginners actually lose money', icon:'p6',
  takeaways:['Beginners lose money to scams, leverage, and hype tops — far more than to price drops','"Guaranteed returns" is always a scam. Real support never asks for your seed phrase','Leverage = borrowed money = the fastest route to zero. None, ever','Seed phrase on paper, two copies, two places. Hardware wallet once you hold €1,000+'],
  steps:[
  T('Where the money actually goes',`<p>Ranked by how beginners really lose money:</p><ol class="steps"><li><b>Scams and phishing</b> — someone talks you out of your keys or your euros.</li><li><b>Leverage</b> — trading with borrowed money.</li><li><b>Buying the top of a hype</b> — the coin everyone’s talking about, at the moment everyone’s talking about it.</li><li><b>Exchange collapse</b> — FTX, Celsius.</li><li><b>Losing the seed phrase</b> — the coins are still there; you just can’t reach them.</li></ol><p>Notice what isn’t on the list: "Bitcoin went down". Prices recover. These don’t.</p>`),
  T('The five scams you will meet',`<ol class="steps"><li><b>The giveaway.</b> "Send 1 ETH, get 2 back" from a fake Elon / fake exchange. Nobody doubles money.</li><li><b>The mentor.</b> A WhatsApp or Telegram group where a "trading expert" guarantees returns. The screenshots are fake; the exit is planned.</li><li><b>Fake support.</b> A DM from "Coinbase support" asking for your 12 words to "verify". <b>Real support never asks. Ever.</b></li><li><b>Fake sites.</b> A copy of your exchange or wallet one letter off. Bookmark the real URL; never click from a search ad or email.</li><li><b>The honeypot.</b> A token you can buy but mysteriously can’t sell. Rug pulls: the creators drain the pool and vanish.</li></ol>${ex('The one rule that covers all five','<p><b>Guaranteed returns = scam.</b> Always. No exceptions in the history of finance.</p>','warn')}`),
  MC('Message: "Hi, Coinbase Support here. To verify your account, please share your 12-word recovery phrase." You…',['Share it — it’s Coinbase','Share only 6 of the words to be safe','Ignore, report, and never share the words with anyone','Ask them to prove they’re Coinbase first'],2,'No legitimate company will ever ask for your seed phrase — they don’t need it and can’t use it for support. Anyone asking is stealing.'),
  T('Leverage: borrowed money, fastest route to zero',`<p>"10× leverage" means you control €1,000 with €100 of your own. A <b>10% move against you erases everything</b> — and crypto moves 10% on a Tuesday. Exchanges advertise it heavily because they profit when you get "liquidated".</p><p>Words that mean leverage: <b>futures, perps, perpetuals, margin, 5× / 10× / 100×</b>. Beginner rule: none of it. Not once. Not "just to try".</p>`),
  TF('With 10× leverage, a 10% price drop against you means you lose 10% of your money.',false,'It means you lose 100%. Leverage multiplies the loss too — that’s the part the ads leave out.'),
  T('Protecting your keys',`<div class="kv"><span class="k">Seed phrase</span><span>On paper (or steel), <b>two copies, two places</b>. Never a photo, never the cloud, never typed into a website, never in a chat.</span><span class="k">Exchange login</span><span>Two-factor with an <b>authenticator app</b> (Google Authenticator, Authy), not SMS — SIM swaps are real.</span><span class="k">Hardware wallet</span><span>Ledger or Trezor, €60–150. Worth it once you hold more than you’d hate to lose — roughly €1,000+.</span><span class="k">Links</span><span>Bookmarks only. No search ads, no email links, no "urgent" DMs.</span></div>`),
  MATCH([['Seed phrase','Paper in a drawer, two copies'],['Exchange account','Authenticator-app 2FA'],['€1,000+ in crypto','Hardware wallet'],['Unknown link in a DM','Don’t click'],['"Guaranteed 20% a month"','Scam, always']],'Boring habits, no exceptions. Security is a checklist, not a feeling.'),
  T('Case files',`<div class="tblwrap"><table class="tbl"><tr><th>When</th><th>What</th><th>Lesson</th></tr><tr><td class="mono">2014</td><td><b>Mt. Gox</b> — biggest exchange, hacked, ~850,000 BTC gone</td><td>Not your keys</td></tr><tr><td class="mono">May 2022</td><td><b>Terra / UST</b> — "stable" coin with nothing behind it, ~$40B lost</td><td>Ask what backs the $1</td></tr><tr><td class="mono">Jun 2022</td><td><b>Celsius</b> — promised up to 18% yield, froze withdrawals, bankrupt</td><td>Where does the yield come from?</td></tr><tr><td class="mono">Nov 2022</td><td><b>FTX</b> — used customer money for its own bets</td><td>Not your keys, again</td></tr></table></div><p>Same pattern every time: <b>high promises + someone else holding your money</b>.</p>`),
  MC('A platform offers 18% a year on stablecoins, "risk-free". The right question is…',['How do I sign up fast?','Where does 18% come from? If nobody can explain it, the yield is me','Is 18% enough?','Can I add leverage?'],1,'Real yields on stablecoins are a few percent — from lending to borrowers who pay interest. 18% means they’re taking risks with your money you can’t see. Celsius, 2022.'),
]},
{ id:'harvest', name:'The Harvest', sub:'Selling, taxes, staying sane', icon:'p7',
  takeaways:['Decide how you’ll sell before you need to: rebalance back to your slice, or ladder out','Germany: hold over 1 year → gains tax-free for private individuals. Swaps count as sales','Yield is the cherry, not the cake. Over ~10% has hidden risk','Check monthly or quarterly. Turn off price notifications. Boring beats clever over ten years'],
  steps:[
  T('Have a selling plan before you need one',`<p>People don’t lose in crypto because they never sold. They lose because they sold <i>in panic</i>. Pick a rule now, while you’re calm:</p><div class="kv"><span class="k">Rebalance</span><span>Your slice was 5%. A boom pushes it to 15%. Sell back to 5–7%. That’s automatic profit-taking and it forces you to sell high, buy low.</span><span class="k">Ladder</span><span>Sell 10–20% of your position each time it doubles. Never all in, never all out.</span><span class="k">Never sell</span><span>Legitimate too — if the size is small enough that you truly don’t need it. Then you only sell to spend, slowly.</span></div>`),
  MC('Your crypto grew from 5% to 15% of your investments. "Rebalancing" means…',['Buy more to celebrate','Sell some crypto back toward your target slice and move it into the rest of your investments','Sell everything','Switch from BTC to altcoins'],1,'Rebalancing locks in gains and puts your risk back where you decided it should be — mechanically, without a prediction.'),
  T('Taxes in Germany (private investors)',`<div class="kv"><span class="k">Held over 1 year</span><span>Sell → <b>gains are tax-free</b> (§23 EStG). This is a big, real advantage of holding.</span><span class="k">Sold within 1 year</span><span>Gains are taxed as income if your total short-term gains exceed <b>€1,000</b> in the year (Freigrenze — go €1 over and all of it is taxable).</span><span class="k">Swaps count</span><span>ETH → SOL is a sale of ETH, even though no euros appeared.</span><span class="k">Staking rewards</span><span>Count as income when received.</span></div>${ex('Practical','<p>Tools like <b>CoinTracking</b> or <b>Blockpit</b> (both German) read your exchange history and produce the tax report. Rules change — check each year — but the one-year rule makes buy-and-hold structurally better here.</p>','info')}`),
  TF('Swapping ETH for SOL within a year is not a taxable event because no euros were involved.',false,'In Germany a coin-to-coin swap is a sale of the first coin. If it was held under a year and you’re over the €1,000 Freigrenze, it’s taxable.'),
  T('Yield, staking, "earning on your crypto"',`<p><b>Staking ETH</b> (~3–4% a year): you help secure the network and get paid in ETH. Low risk if done through a reputable exchange or a well-known protocol.</p><p><b>Lending stablecoins</b> on protocols like Aave: a few percent, variable, from real borrowers paying interest.</p><p>Above ~10%, someone is taking a risk you can’t see. Yield is the <b>cherry</b>, never the cake — a 4% yield on an asset that can drop 70% doesn’t change the maths.</p>`),
