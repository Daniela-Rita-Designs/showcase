/* ---------- state ---------- */
const STORE='money-garden-v1';
function load(){try{return Object.assign({done:{},xp:0,streak:0,last:null,plan:null},JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return {done:{},xp:0,streak:0,last:null,plan:null}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(P))}catch(e){}}
let P=load();
const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const icon=id=>`<svg><use href="#${id}"/></svg>`;

/* ---------- garden ---------- */
function firstOpen(){for(let i=0;i<UNITS.length;i++){if(!P.done[UNITS[i].id])return i}return UNITS.length}
function renderGarden(){
  const open=firstOpen();
  const doneCount=Object.keys(P.done).length;
  const GAP=168, W=520, H=90+GAP*(UNITS.length-1)+110;
  const pos=UNITS.map((u,i)=>({x:i%2===0?150:370,y:90+i*GAP}));
  let segs='';
  for(let i=1;i<pos.length;i++){const a=pos[i-1],b=pos[i];segs+=`<path class="seg ${P.done[UNITS[i-1].id]?'done':''}" d="M${a.x},${a.y} C${a.x},${a.y+GAP*.55} ${b.x},${b.y-GAP*.55} ${b.x},${b.y}"/>`}
  const nodes=UNITS.map((u,i)=>{
    const st=P.done[u.id]?'done':(i===open?'active':'locked');
    const sc=P.done[u.id]?`<span class="sc">${P.done[u.id].score}% · sun ${P.done[u.id].xp}</span>`:'';
    return `<div class="node ${st}" style="left:${pos[i].x/W*100}%;top:${pos[i].y}px"><button class="pot" ${st==='locked'?'disabled':''} data-i="${i}" aria-label="${u.name}">${icon(u.icon)}</button><div class="lab"><b>${u.name}</b><span>${u.sub}</span>${sc}</div></div>`}).join('');
  const heroHTML=doneCount===0?`<section class="hero"><div class="eyebrow">Start here</div><h2>Crypto without the numbers-and-arrows feeling</h2><p>Eight short units: what the tokens actually are, why prices move, when to buy, how much, and what to avoid. Real coins, real stories, plain words. Then a Planner with your own numbers.</p><div class="cta"><button class="btn primary" data-start="0">Plant the first seed</button></div></section>`
    :doneCount===UNITS.length?`<section class="hero"><div class="eyebrow">Garden complete</div><h2>You know the plants, the seasons and the pests</h2><p>Reopen any unit to review, or open the Planner to set your monthly amount. The 1st of the month is your day.</p><div class="cta"><button class="btn primary" data-open="plan">Open the Planner</button></div></section>`
    :`<section class="hero"><div class="eyebrow">Next up</div><h2>${UNITS[open].name}</h2><p>${UNITS[open].sub}. ${UNITS[open].steps.length} short steps.</p><div class="cta"><button class="btn primary" data-start="${open}">Continue</button></div></section>`;
  app.innerHTML=headerHTML('learn')+`
  ${heroHTML}
  <div class="map" style="height:${H}px"><svg class="path" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${segs}</svg>${nodes}</div>
  <p class="footnote">Education, not personal financial advice. Prices and rules are approximate and were last checked in early 2026 — always verify current tax rules.</p>`;
  app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startLesson(+b.dataset.start));
  app.querySelectorAll('.pot:not(:disabled)').forEach(b=>b.onclick=()=>startLesson(+b.dataset.i));
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open));
  bindTabs();scrollTo({top:0});
}

/* ---------- lesson engine ---------- */
let S=null;
function startLesson(idx){
  const unit=UNITS[idx];
  const queue=unit.steps.map((st,i)=>Object.assign({_id:i},st));
  const gradeable=queue.filter(s=>s.type!=='teach').length;
  S={idx,unit,queue,pos:0,results:{},gradeable,checked:false};
  app.innerHTML=`<div class="lesson"><div class="ltop"><button class="x" aria-label="Back to garden">×</button><div class="pbar"><i id="pfill"></i></div><span class="cnt mono" id="cnt"></span></div><div class="stage" id="stage"></div><div class="foot" id="foot"></div><div class="fb" id="fb"></div></div>`;
  app.querySelector('.x').onclick=()=>renderGarden();
  renderStep();scrollTo({top:0});
}
function progress(){document.getElementById('pfill').style.width=(S.pos/S.queue.length*100)+'%';document.getElementById('cnt').textContent=`${Math.min(S.pos+1,S.queue.length)}/${S.queue.length}`}
function renderStep(){
  if(S.pos>=S.queue.length)return renderComplete();
  progress();
  const step=S.queue[S.pos],stage=document.getElementById('stage'),foot=document.getElementById('foot'),fb=document.getElementById('fb');
  fb.className='fb';S.checked=false;S.sel=null;
  const eyebrow=`<div class="eyebrow">${S.unit.name}${step._retry?' · one more time':''}</div>`;
  if(step.type==='teach'){
    stage.innerHTML=`${eyebrow}<h2>${step.title}</h2><div class="body">${step.body}</div>`;
    foot.innerHTML=`<button class="btn primary block" id="go">Continue</button>`;
    document.getElementById('go').onclick=()=>{S.pos++;renderStep();stage.scrollTop=0};
  }
  else if(step.type==='mc'){
    stage.innerHTML=`${eyebrow}<h2 class="q">${step.q}</h2><div class="opts">${step.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
    foot.innerHTML=`<button class="btn primary block" id="check" disabled>Check</button>`;
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.checked)return;stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.sel=+b.dataset.i;document.getElementById('check').disabled=false});
    document.getElementById('check').onclick=()=>{const ok=S.sel===step.a;stage.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===step.a)b.classList.add('ok');else if(+b.dataset.i===S.sel)b.classList.add('bad')});grade(ok,step)};
  }
  else if(step.type==='tf'){
    stage.innerHTML=`${eyebrow}<h2 class="q">True or false?</h2><div class="stmt">${step.q}</div><div class="tf"><button class="opt" data-v="1">True</button><button class="opt" data-v="0">False</button></div>`;
    foot.innerHTML=`<button class="btn primary block" id="check" disabled>Check</button>`;
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.checked)return;stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.sel=b.dataset.v==='1';document.getElementById('check').disabled=false});
    document.getElementById('check').onclick=()=>{const ok=S.sel===step.a;stage.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const v=b.dataset.v==='1';if(v===step.a)b.classList.add('ok');else if(v===S.sel)b.classList.add('bad')});grade(ok,step)};
  }
  else if(step.type==='match'){
    const L=shuffle(step.pairs.map((p,i)=>({t:p[0],i}))),R=shuffle(step.pairs.map((p,i)=>({t:p[1],i})));
    stage.innerHTML=`${eyebrow}<h2 class="q">Tap the matching pairs</h2><div class="match"><div class="col">${L.map(o=>`<button class="opt l" data-i="${o.i}">${o.t}</button>`).join('')}</div><div class="col">${R.map(o=>`<button class="opt r" data-i="${o.i}">${o.t}</button>`).join('')}</div></div>`;
    foot.innerHTML=`<div style="font-size:13px;color:var(--muted);text-align:center">Pick one on the left, then its partner on the right</div>`;
    let left=null,mistakes=0,matched=0;
    stage.querySelectorAll('.opt.l').forEach(b=>b.onclick=()=>{if(b.classList.contains('matched'))return;stage.querySelectorAll('.opt.l').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');left=b});
    stage.querySelectorAll('.opt.r').forEach(b=>b.onclick=()=>{if(!left||b.classList.contains('matched'))return;
      if(b.dataset.i===left.dataset.i){b.classList.add('matched');left.classList.add('matched');left.classList.remove('sel');left=null;matched++;if(matched===step.pairs.length)grade(mistakes===0,step,mistakes>0?`${mistakes} slip${mistakes>1?'s':''} on the way — it comes back once at the end.`:null)}
      else{mistakes++;b.classList.add('shake');left.classList.add('shake');setTimeout(()=>{b.classList.remove('shake');left&&left.classList.remove('shake')},400)}});
  }
  else if(step.type==='order'){
    const bank=shuffle(step.items.map((t,i)=>({t,i})));let seq=[];
    stage.innerHTML=`${eyebrow}<h2 class="q">${step.q}</h2><div class="seq" id="seq"></div><div class="bank" id="bank"></div>`;
    foot.innerHTML=`<button class="btn primary block" id="check" disabled>Check</button>`;
    const draw=()=>{const sq=document.getElementById('seq'),bk=document.getElementById('bank');
      sq.innerHTML=seq.length?seq.map((o,k)=>`<button class="chipbtn" data-i="${o.i}"><span class="n">${k+1}</span>${o.t}</button>`).join(''):'<span class="ph">Tap the steps below in order</span>';
      bk.innerHTML=bank.filter(o=>!seq.includes(o)).map(o=>`<button class="chipbtn" data-i="${o.i}">${o.t}</button>`).join('');
      if(!S.checked){sq.querySelectorAll('.chipbtn').forEach(b=>b.onclick=()=>{seq=seq.filter(o=>o.i!==+b.dataset.i);draw()});bk.querySelectorAll('.chipbtn').forEach(b=>b.onclick=()=>{seq.push(bank.find(o=>o.i===+b.dataset.i));draw()})}
      document.getElementById('check').disabled=seq.length!==step.items.length};
    draw();
    document.getElementById('check').onclick=()=>{S.checked=true;let ok=true;document.querySelectorAll('#seq .chipbtn').forEach((b,k)=>{const good=+b.dataset.i===k;if(!good)ok=false;b.classList.add(good?'ok':'bad');b.onclick=null});grade(ok,step,ok?null:'Right order: '+step.items.join(' → '))};
  }
  else if(step.type==='slider'){
    const start=Math.round((step.min+step.max)/2/step.step)*step.step;
    stage.innerHTML=`${eyebrow}<h2 class="q">${step.q}</h2><div class="slider"><div class="val"><span id="sv">${start}</span><small>${step.unit}</small></div><input type="range" id="rng" min="${step.min}" max="${step.max}" step="${step.step}" value="${start}"><div class="rng"><span>${step.min}${step.unit}</span><span>${step.max}${step.unit}</span></div></div>`;
    foot.innerHTML=`<button class="btn primary block" id="check">Check</button>`;
    const r=document.getElementById('rng');r.oninput=()=>document.getElementById('sv').textContent=r.value;
    document.getElementById('check').onclick=()=>{r.disabled=true;const v=+r.value,ok=Math.abs(v-step.a)<=step.tol;grade(ok,step,ok?null:`The answer is ${step.a}${step.unit}.`)};
  }
}
function grade(ok,step,extra){
  if(S.checked&&step.type!=='order')return;S.checked=true;
  if(!step._retry)S.results[step._id]=ok;
  if(!ok)S.queue.push(Object.assign({},step,{_retry:true}));
  const fb=document.getElementById('fb');
  fb.className='fb show '+(ok?'ok':'bad');
  fb.innerHTML=`<div class="fbt">${ok?['Exactly.','Nicely done.','That’s it.','Green thumb.'][Math.random()*4|0]:'Not quite'}</div><div class="why">${extra?extra+' ':''}${step.why||''}</div><button class="btn block ${ok?'ok':'bad'}" id="next">Continue</button>`;
  document.getElementById('next').onclick=()=>{S.pos++;renderStep();document.getElementById('stage').scrollTop=0};
  document.getElementById('foot').innerHTML='';
}
function renderComplete(){
  const ids=Object.keys(S.results),right=ids.filter(k=>S.results[k]).length;
  const score=S.gradeable?Math.round(right/S.gradeable*100):100;
  const xp=right*10+20;
  const prev=P.done[S.unit.id];
  P.done[S.unit.id]={score:prev?Math.max(prev.score,score):score,xp:prev?Math.max(prev.xp,xp):xp,at:Date.now()};
  P.xp+=xp;
  const today=new Date().toDateString();
  if(P.last!==today){const y=new Date(Date.now()-864e5).toDateString();P.streak=(P.last===y)?P.streak+1:1;P.last=today}
  save();
  document.getElementById('pfill').style.width='100%';document.getElementById('cnt').textContent='';
  document.getElementById('fb').className='fb';document.getElementById('foot').innerHTML='';
  document.getElementById('stage').innerHTML=`<div class="done-card"><div style="color:var(--grow);width:64px;height:64px;margin:0 auto;display:grid;place-items:center;border-radius:50%;background:var(--grow-soft)"><svg width="40" height="40"><use href="#${S.unit.icon}"/></svg></div><div class="big">${S.unit.name} — planted</div><p>${score===100?'Perfect run.':score>=70?'Solid. The wrong ones came back and you got them.':'Done. Replay it any time from the garden.'}</p>
  <div class="score"><div><b>+${xp}</b><span>sun points</span></div><div><b>${score}%</b><span>first try</span></div></div>
  <div class="take"><div class="eyebrow">Keep these</div><ul>${S.unit.takeaways.map(t=>`<li>${t}</li>`).join('')}</ul></div>
  <button class="btn primary block" id="back">Back to the garden</button></div>`;
  document.getElementById('back').onclick=()=>renderGarden();
}

/* ---------- sheets ---------- */
const overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet');
function closeSheet(){overlay.classList.remove('show')}
overlay.onclick=e=>{if(e.target===overlay)closeSheet()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function openSheet(which){
  overlay.classList.add('show');
  if(which==='dict'){
    const list=q=>DICT.filter(d=>!q||(d[0]+' '+d[1]).toLowerCase().includes(q)).map(d=>`<dt>${d[0]}</dt><dd>${d[1]}</dd>`).join('')||'<dd>No match. Try another word.</dd>';
    sheet.innerHTML=`<div class="sh"><h2>Dictionary</h2><button class="x" aria-label="Close">×</button></div><input class="search" id="q" placeholder="Search a word…" autocomplete="off"><dl class="dict" id="dl">${list('')}</dl>`;
    sheet.querySelector('#q').oninput=e=>{sheet.querySelector('#dl').innerHTML=list(e.target.value.trim().toLowerCase())};
  }else{
    const p=Object.assign({income:'',expenses:'',savings:'',months:4,investPct:40,risk:5},P.plan||{});
    sheet.innerHTML=`<div class="sh"><h2>Planner</h2><button class="x" aria-label="Close">×</button></div>
    <p style="color:var(--muted);font-size:14px;margin-bottom:14px">Your numbers stay on this device. Monthly figures, in euros.</p>
    <div class="frm">
      <div class="two"><label>Net income / month<input type="number" id="income" placeholder="3000" value="${p.income}"></label><label>Living costs / month<input type="number" id="expenses" placeholder="1900" value="${p.expenses}"></label></div>
      <label>Cash savings today (not invested)<input type="number" id="savings" placeholder="4000" value="${p.savings}"></label>
      <label><span class="lt">Cushion size: <span id="ml" class="mono">${p.months}</span> months of costs</span><input type="range" id="months" min="3" max="6" step="1" value="${p.months}"></label>
      <label><span class="lt">Share of what’s left each month that you invest: <span id="il" class="mono">${p.investPct}%</span></span><input type="range" id="investPct" min="10" max="100" step="5" value="${p.investPct}"></label>
      <label><span class="lt">Crypto slice of your investing</span><div class="seg3"><button data-r="3" class="${p.risk==3?'on':''}">Cautious<br>3%</button><button data-r="5" class="${p.risk==5?'on':''}">Standard<br>5%</button><button data-r="10" class="${p.risk==10?'on':''}">Bold<br>10%</button></div></label>
    </div>
    <div class="plan-out" id="out"></div>
    <p class="note">Education, not personal financial advice. Rules of thumb: 3–6 month cushion, crypto as 1–10% of investments, core = BTC + ETH.</p>`;
    const read=()=>({income:+sheet.querySelector('#income').value||0,expenses:+sheet.querySelector('#expenses').value||0,savings:+sheet.querySelector('#savings').value||0,months:+sheet.querySelector('#months').value,investPct:+sheet.querySelector('#investPct').value,risk:+(sheet.querySelector('.seg3 .on')||{dataset:{r:5}}).dataset.r});
    const eur=n=>'€'+Math.round(n).toLocaleString('en-IE');
    const calc=()=>{const v=read();P.plan=v;save();
      sheet.querySelector('#ml').textContent=v.months;sheet.querySelector('#il').textContent=v.investPct+'%';
      const out=sheet.querySelector('#out');
      if(!v.income||!v.expenses){out.innerHTML=`<div class="pcard"><p>Fill in income and living costs to see your plan.</p></div>`;return}
      const left=Math.max(0,v.income-v.expenses),target=v.expenses*v.months,gap=Math.max(0,target-v.savings),pct=Math.min(100,v.savings/target*100);
      const invest=left*v.investPct/100,toCushion=gap>0?left-invest:0;
      const monthsToFill=gap>0&&toCushion>0?Math.ceil(gap/toCushion):0;
      const crypto=invest*v.risk/100,btc=crypto*.5,eth=crypto*.3,rest=crypto*.2;
      const startLine=gap===0?'Your cushion is full — the 1st of next month is your start.':toCushion>0?`Cushion full in about <b>${monthsToFill} month${monthsToFill>1?'s':''}</b>. You can start crypto now with a tiny amount to learn, and move to the full amount then.`:'Everything left is going to investing — send some to the cushion first.';
      out.innerHTML=`
      <div class="pcard"><div class="eyebrow">Cushion</div><div class="big">${eur(v.savings)} <small>of ${eur(target)} (${v.months} months)</small></div><div class="bar"><i style="width:${pct}%"></i></div><p>${gap>0?`${eur(gap)} still to save. Suggested: ${eur(toCushion)}/month to the cushion until then.`:'Full. This is what lets you never sell in a panic.'}</p></div>
      <div class="pcard"><div class="eyebrow">Each month</div><div class="big">${eur(invest)} <small>invested, of ${eur(left)} left over</small></div><p>Of that, <b style="color:var(--text)">${eur(crypto)}</b> is your crypto slice (${v.risk}%). The rest goes to broad, boring investments like a world index fund.</p><div class="split"><div><b>${eur(btc)}</b><span>BTC</span></div><div><b>${eur(eth)}</b><span>ETH</span></div><div><b>${eur(rest)}</b><span>experiment / USDC</span></div></div>${crypto<20&&crypto>0?'<p>Under €20 a month gets eaten by fees — round up to €25 and buy every other month if needed.</p>':''}</div>
      <div class="pcard"><div class="eyebrow">When</div><div class="big">The 1st <small>every month, automatic</small></div><p>${startLine}</p></div>`};
    sheet.querySelectorAll('input').forEach(i=>i.oninput=calc);
    sheet.querySelectorAll('.seg3 button').forEach(b=>b.onclick=()=>{sheet.querySelectorAll('.seg3 button').forEach(x=>x.classList.remove('on'));b.classList.add('on');calc()});
    calc();
  }
  sheet.querySelector('.x').onclick=closeSheet;
  sheet.scrollTop=0;
}

/* ---------- ARENA data ---------- */
function A(){if(!P.arena)P.arena={pr:800,sr:800,rush:0,seasons:[],daily:null,recent:[],hist:[800],shist:[800],solved:0};return P.arena}
function elo(R,Rp,S,K){const E=1/(1+Math.pow(10,(Rp-R)/400));return Math.round(K*(S-E))}
const fmt$=n=>'$'+Math.round(n).toLocaleString('en-US');
function spark(pts,o){o=o||{};const W=320,H=o.h||90,pad=6;const mn=Math.min(...pts),mx=Math.max(...pts);const sx=i=>pad+i*(W-2*pad)/(pts.length-1),sy=v=>H-pad-(v-mn)/((mx-mn)||1)*(H-2*pad-(o.vol?20:0));
  let vol='';if(o.vol){const vm=Math.max(...o.vol);vol=o.vol.map((v,i)=>`<rect x="${sx(i)-4}" y="${H-2-v/vm*18}" width="8" height="${v/vm*18}" fill="var(--sky)" opacity=".55"/>`).join('')}
  return `<div class="fig" style="margin-top:8px"><svg viewBox="0 0 ${W} ${H}">${vol}<polyline fill="none" stroke="${o.color||'var(--sun)'}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((v,i)=>sx(i)+','+sy(v)).join(' ')}"/><circle cx="${sx(pts.length-1)}" cy="${sy(pts[pts.length-1])}" r="4" fill="${o.color||'var(--sun)'}"/></svg>${o.cap?`<div class="cap">${o.cap}</div>`:''}</div>`}

/* ---------- ARENA home ---------- */
function todayKey(){return new Date().toISOString().slice(0,10)}
function dailyPuzzle(){const k=todayKey();let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return PZ[h%PZ.length]}
function renderArena(){
  const a=A();const rec=a.seasons;const w=rec.filter(x=>x.win).length,l=rec.length-w;
  const dailyDone=a.daily===todayKey();
  const sp=h=>{if(h.length<2)return '';const W=100,H=22,mn=Math.min(...h),mx=Math.max(...h);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--grow)" stroke-width="2" points="${h.map((v,i)=>(i*W/(h.length-1))+','+(H-2-(v-mn)/((mx-mn)||1)*(H-4))).join(' ')}"/></svg>`};
  app.innerHTML=headerHTML('play')+`
  <div class="ratings"><div class="rt"><div class="eyebrow">Puzzle rating</div><b class="mono">${a.pr}</b><span>${a.solved} solved</span>${sp(a.hist.slice(-20))}</div><div class="rt"><div class="eyebrow">Season rating</div><b class="mono">${a.sr}</b><span>${w}W · ${l}L</span>${sp(a.shist.slice(-20))}</div><div class="rt"><div class="eyebrow">Rush best</div><b class="mono">${a.rush}</b><span>in 3 minutes</span></div></div>
  <div class="modes">
    <button class="mode daily" data-m="daily" ${dailyDone?'disabled':''}><span class="mi">☼</span><div><b>Daily puzzle</b><span>${dailyDone?'Solved today — back tomorrow':'One rated puzzle, same for everyone today'}</span></div></button>
    <button class="mode rated" data-m="rated"><span class="mi">?</span><div><b>Puzzles</b><span>Real situations, rated. Get it right and your rating climbs</span></div><span class="rec">${PZ.length} in pool</span></button>
    <button class="mode rush" data-m="rush"><span class="mi">3′</span><div><b>Puzzle rush</b><span>Three minutes, three strikes, puzzles get harder</span></div><span class="rec">best ${a.rush}</span></button>
    <button class="mode season" data-m="season"><span class="mi">24</span><div><b>Play a season</b><span>24 real months of Bitcoin, year hidden. Beat the gardener</span></div><span class="rec">${w}–${l}</span></button>
  </div>
  <p class="footnote">Ratings work like chess: each puzzle has a difficulty; beating a harder one earns more. Season prices are real month-end Bitcoin prices, approximate, in dollars.</p>`;
  bindTabs();
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>({daily:startDaily,rated:startRated,rush:startRush,season:startSeason})[b.dataset.m]());
  scrollTo({top:0});
}

/* ---------- puzzles ---------- */
function pickPuzzle(){const a=A();const pool=PZ.filter(p=>!a.recent.includes(p.id));const src=pool.length?pool:PZ;const sorted=src.slice().sort((x,y)=>Math.abs(x.r-a.pr)-Math.abs(y.r-a.pr));return sorted[Math.random()*Math.min(6,sorted.length)|0]}
function shell(topHTML){app.innerHTML=`<div class="lesson"><div class="ltop"><button class="x" aria-label="Back">×</button>${topHTML}</div><div class="stage" id="stage"></div><div class="foot" id="foot"></div><div class="fb" id="fb"></div></div>`;app.querySelector('.x').onclick=()=>{if(R&&R.timer)clearInterval(R.timer);R=null;renderArena()};scrollTo({top:0})}
function puzzleView(pz,label,onAnswer){
  const stage=document.getElementById('stage'),foot=document.getElementById('foot'),fb=document.getElementById('fb');fb.className='fb';
  const opts=shuffle(pz.opts.map((o,i)=>({o,i})));
  stage.innerHTML=`<div class="eyebrow">${label} · <span class="pzr">difficulty ${pz.r}</span></div><h2 class="q">${pz.q}</h2>${pz.fig||''}<div class="opts">${opts.map(x=>`<button class="opt" data-i="${x.i}">${x.o}</button>`).join('')}</div>`;
  foot.innerHTML=`<button class="btn primary block" id="check" disabled>Check</button>`;
  let sel=null;stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i;document.getElementById('check').disabled=false});
  document.getElementById('check').onclick=()=>{const ok=sel===pz.a;stage.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===pz.a)b.classList.add('ok');else if(+b.dataset.i===sel)b.classList.add('bad')});foot.innerHTML='';onAnswer(ok)};
}
function showFB(ok,html,btnLabel,cb){const fb=document.getElementById('fb');fb.className='fb show '+(ok?'ok':'bad');fb.innerHTML=`<div class="fbt">${ok?'Correct.':'Not quite'}</div><div class="why">${html}</div><button class="btn block ${ok?'ok':'bad'}" id="next">${btnLabel}</button>`;document.getElementById('next').onclick=cb}
function ratedAnswer(pz,ok,K){const a=A();const d=elo(a.pr,pz.r,ok?1:0,K||32);a.pr=Math.max(100,a.pr+d);a.hist.push(a.pr);if(a.hist.length>60)a.hist.shift();if(ok)a.solved++;a.recent.push(pz.id);if(a.recent.length>8)a.recent.shift();save();return d}
function startRated(){shell(`<div class="eyebrow" style="flex:1;text-align:center">Rated puzzle</div><span class="cnt mono">${A().pr}</span>`);const pz=pickPuzzle();
  puzzleView(pz,'Puzzle',ok=>{const d=ratedAnswer(pz,ok);document.querySelector('.ltop .cnt').textContent=A().pr;showFB(ok,`<span class="rdelta ${d>=0?'up':'dn'}">${d>=0?'+':''}${d}</span> → rating ${A().pr}<br>${pz.why}`,'Next puzzle',()=>startRated())})}
function startDaily(){const pz=dailyPuzzle();shell(`<div class="eyebrow" style="flex:1;text-align:center">Daily puzzle · ${todayKey()}</div><span class="cnt mono">${A().pr}</span>`);
  puzzleView(pz,'Daily',ok=>{const d=ratedAnswer(pz,ok);A().daily=todayKey();save();showFB(ok,`<span class="rdelta ${d>=0?'up':'dn'}">${d>=0?'+':''}${d}</span> → rating ${A().pr}<br>${pz.why}`,'Back to the arena',()=>renderArena())})}

/* ---------- puzzle rush ---------- */
let R=null;
function startRush(){
  const order=PZ.slice().sort((x,y)=>x.r-y.r);const q=[].concat(shuffle(order.slice(0,10)),shuffle(order.slice(10,22)),shuffle(order.slice(22)));
  R={q,i:0,score:0,strikes:0,end:Date.now()+180000,timer:null};
  shell(`<div class="rushbar"><span class="t" id="rt">3:00</span><span class="strikes" id="rs"><i></i><i></i><i></i></span><span class="rushscore mono" id="rsc">0</span></div>`);
  R.timer=setInterval(()=>{if(!R)return;const left=Math.max(0,R.end-Date.now());const el=document.getElementById('rt');if(!el)return;el.textContent=`${Math.floor(left/60000)}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;el.classList.toggle('low',left<30000);if(left<=0)endRush('Time’s up')},250);
  rushNext();
}
function rushNext(){if(!R)return;if(R.i>=R.q.length)return endRush('You cleared the whole pool');const pz=R.q[R.i++];
  puzzleView(pz,`Rush · #${R.i}`,ok=>{if(!R)return;if(ok)R.score++;else R.strikes++;document.getElementById('rsc').textContent=R.score;document.getElementById('rs').innerHTML=[0,1,2].map(k=>`<i class="${k<R.strikes?'x':''}"></i>`).join('');
    if(R.strikes>=3)return endRush('Three strikes');
    showFB(ok,pz.why,'Next',()=>rushNext());setTimeout(()=>{const n=document.getElementById('next');if(n&&R)n.click()},ok?900:2600)})}
function endRush(reason){if(!R)return;clearInterval(R.timer);const a=A();const best=R.score>a.rush;if(best)a.rush=R.score;save();const sc=R.score;R=null;
  document.getElementById('fb').className='fb';document.getElementById('foot').innerHTML='';
  document.getElementById('stage').innerHTML=`<div class="done-card"><div class="eyebrow">${reason}</div><div class="big">${sc} puzzle${sc===1?'':'s'}</div><p>${best?'New personal best.':'Best: '+a.rush+'.'} ${sc>=15?'That’s a strong run.':sc>=8?'Solid — the hard ones start around #20.':'The pool gets harder as you go. Try again.'}</p><div style="display:grid;gap:10px;margin-top:20px"><button class="btn primary block" id="again">Run it again</button><button class="btn ghost block" id="back">Back to the arena</button></div></div>`;
  document.getElementById('again').onclick=startRush;document.getElementById('back').onclick=renderArena}

const NEWS={'2017-05':'Coins are suddenly on the evening news. New buyers flood in.','2017-08':'A fork splits the network in two. The price shrugs and climbs.','2017-11':'Everyone you know is asking how to buy.','2017-12':'Wall Street launches futures on it. Peak euphoria.','2018-01':'Rumours of a ban in Asia. First big red month.','2018-03':'The big social networks ban crypto ads.','2018-06':'Exchange hack in Asia. "Crypto is dead" headlines are back.','2018-11':'A bitter fork war and a capitulation drop.','2018-12':'Nobody talks about crypto anymore.','2019-04':'A quiet +20% day out of nowhere.','2019-06':'A tech giant announces its own coin. (It never launches.)','2019-10':'A large country’s leader praises blockchain. Brief spike.','2020-03':'Pandemic panic. Everything sells off at once — stocks, gold, crypto.','2020-05':'Halving: new supply cut in half this month.','2020-10':'A major payments company lets its users buy crypto.','2020-12':'Public companies start buying for their treasuries. New all-time high.','2021-02':'A famous carmaker buys $1.5 billion.','2021-04':'The biggest US exchange lists on the stock market.','2021-05':'A large country bans mining. The carmaker stops accepting payments.','2021-09':'A country makes it legal tender.','2021-10':'First US ETF (futures-based) launches.','2021-11':'New all-time high. Your taxi driver mentions it.','2022-01':'Central banks signal rate hikes. Risk assets wobble.','2022-05':'A $40 billion "stablecoin" collapses to nearly zero.','2022-06':'A major lender freezes withdrawals. A big hedge fund blows up.','2022-11':'A top-3 exchange goes bankrupt overnight.','2022-12':'Coldest sentiment in years.','2023-03':'Banks fail in the US. A major stablecoin briefly trades at $0.88, then recovers.','2023-06':'The world’s largest asset manager files for a spot ETF.','2023-10':'ETF approval rumours.','2024-01':'Spot ETFs approved. Pension money can now buy.','2024-03':'New all-time high before the halving — a first.','2024-04':'Halving.','2024-08':'A global carry-trade unwind. Everything drops for a week.','2024-11':'Election result seen as pro-crypto.','2024-12':'Crosses $100,000.'};
const SEASONS=[{id:'A',from:'2017-01'},{id:'B',from:'2019-01'},{id:'C',from:'2020-07'},{id:'D',from:'2022-01'},{id:'E',from:'2023-01'}];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function seasonData(from){let [y,m]=from.split('-').map(Number);const out=[];for(let i=0;i<24;i++){const key=`${y}-${String(m).padStart(2,'0')}`;out.push({key,label:`${MON[m-1]} ${y}`,p:BTC[y][m-1],news:NEWS[key]||null});m++;if(m>12){m=1;y++}}return out}
let G=null;
const START=12000,FEE=.01,DCA=500;
function startSeason(){const a=A();const played=a.seasons.map(s=>s.id);const pool=SEASONS.filter(s=>!played.includes(s.id));const s=(pool.length?pool:SEASONS)[Math.random()*(pool.length?pool.length:SEASONS.length)|0];
  G={s,d:seasonData(s.from),i:0,cash:START,btc:0,fees:0,log:[],dcaCash:START,dcaBtc:0};
  shell(`<div class="eyebrow" style="flex:1;text-align:center" id="gt"></div><span class="cnt mono" id="gv"></span>`);
  document.getElementById('foot').style.display='none';renderTurn()}
function gval(){return G.cash+G.btc*G.d[G.i].p}
function dcaStep(){if(G.dcaCash>=DCA){G.dcaBtc+=DCA*(1-FEE)/G.d[G.i].p;G.dcaCash-=DCA}}
function mood(){if(G.i<1)return 50;const back=Math.max(0,G.i-3);const r=G.d[G.i].p/G.d[back].p-1;return Math.max(0,Math.min(100,Math.round(50+r*90)))}
function gchart(){const d=G.d.slice(0,G.i+1).map(x=>x.p);const W=320,H=130,pl=8,pr=8,pt=10,pb=18;const mn=Math.min(...d)*.95,mx=Math.max(...d)*1.05;const sx=i=>pl+i*(W-pl-pr)/23,sy=v=>pt+(H-pt-pb)-(v-mn)/(mx-mn)*(H-pt-pb);
  const pts=d.map((v,i)=>sx(i)+','+sy(v)).join(' ');const area=`M${sx(0)},${H-pb} L${pts.split(' ').join(' L')} L${sx(d.length-1)},${H-pb}Z`;
  const marks=G.log.map(l=>l.t==='buy'?`<circle cx="${sx(l.i)}" cy="${sy(G.d[l.i].p)}" r="4.5" fill="var(--grow)" stroke="var(--surface2)" stroke-width="2"/>`:l.t==='sell'?`<circle cx="${sx(l.i)}" cy="${sy(G.d[l.i].p)}" r="4.5" fill="var(--heat)" stroke="var(--surface2)" stroke-width="2"/>`:'').join('');
  const grid=[0,1,2,3].map(k=>`<line x1="${pl}" x2="${W-pr}" y1="${pt+k*(H-pt-pb)/3}" y2="${pt+k*(H-pt-pb)/3}" stroke="currentColor" opacity=".08"/>`).join('');
  return `<div class="gchart"><svg viewBox="0 0 ${W} ${H}">${grid}<path d="${area}" fill="var(--sun)" opacity=".10"/><polyline fill="none" stroke="var(--sun)" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/>${marks}<circle cx="${sx(d.length-1)}" cy="${sy(d[d.length-1])}" r="5" fill="var(--sun)"/><text x="${pl}" y="${H-4}" font-size="9" fill="currentColor" opacity=".55" font-family="JetBrains Mono, monospace">month 1</text><text x="${W-pr}" y="${H-4}" font-size="9" fill="currentColor" opacity=".55" text-anchor="end" font-family="JetBrains Mono, monospace">month 24</text></svg></div>`}
function renderTurn(){
  const m=G.d[G.i],prev=G.i?G.d[G.i-1].p:null,chg=prev?(m.p/prev-1)*100:0;const md=mood();
  document.getElementById('gt').textContent=`Season · month ${G.i+1} of 24`;document.getElementById('gv').textContent=fmt$(gval());
  const dcaVal=G.dcaCash+G.dcaBtc*m.p;
  document.getElementById('stage').innerHTML=`
  <div class="prow"><div><div class="eyebrow">Bitcoin · month ${G.i+1}</div><div class="px">${fmt$(m.p)}</div><div class="chg ${chg>=0?'up':'dn'}">${prev?(chg>=0?'+':'')+chg.toFixed(1)+'% this month':'opening price'}</div></div><div class="mood"><span>Crowd mood · ${md<25?'fear':md<45?'nervous':md<60?'neutral':md<80?'greedy':'euphoric'}</span><div class="g"><i style="left:${md}%"></i></div></div></div>
  ${gchart()}
  <div class="news"><div class="eyebrow">This month</div>${m.news||'A quiet month. Nothing much in the news.'}</div>
  <div class="hold"><div><b>${fmt$(G.cash)}</b><span>cash</span></div><div><b>${G.btc.toFixed(3)}</b><span>BTC · ${fmt$(G.btc*m.p)}</span></div><div><b>${fmt$(gval())}</b><span>total</span><div class="vs">gardener ${fmt$(dcaVal)}</div></div></div>
  <div class="acts">
    <div class="row"><span class="l">Buy</span>${[250,500,1000,2000].map(v=>`<button class="ab" data-buy="${v}" ${G.cash<v?'disabled':''}>$${v>=1000?(v/1000)+'k':v}</button>`).join('')}</div>
    <div class="row sell"><span class="l">Sell</span>${[25,50,100].map(v=>`<button class="ab" data-sell="${v}" ${G.btc<=0?'disabled':''}>${v===100?'all':v+'%'}</button>`).join('')}</div>
    <button class="btn ghost block" id="hold">Hold — next month</button>
  </div>`;
  const st=document.getElementById('stage');
  st.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>act('buy',+b.dataset.buy));
  st.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>act('sell',+b.dataset.sell));
  document.getElementById('hold').onclick=()=>act('hold');
}
function act(t,v){const m=G.d[G.i];const prev=G.i?G.d[G.i-1].p:m.p;const chg=m.p/prev-1;
  if(t==='buy'){const amt=Math.min(v,G.cash);G.btc+=amt*(1-FEE)/m.p;G.cash-=amt;G.fees+=amt*FEE;G.log.push({i:G.i,t,amt,chg})}
  else if(t==='sell'){const q=G.btc*v/100;const gross=q*m.p;G.cash+=gross*(1-FEE);G.btc-=q;G.fees+=gross*FEE;G.log.push({i:G.i,t,amt:gross,frac:v,chg})}
  else G.log.push({i:G.i,t,chg});
  dcaStep();
  if(G.i>=23)return endSeason();G.i++;renderTurn();document.getElementById('stage').scrollTop=0}
function endSeason(){
  const last=G.d[23].p,you=gval(),dca=G.dcaCash+G.dcaBtc*last,lump=START*(1-FEE)/G.d[0].p*last,cash=START;
  const S=you>dca*1.02?1:you<dca*.98?0:.5;const a=A();const d=elo(a.sr,1200,S,40);a.sr=Math.max(100,a.sr+d);a.shist.push(a.sr);if(a.shist.length>60)a.shist.shift();
  a.seasons.push({id:G.s.id,win:S===1,you:Math.round(you),dca:Math.round(dca)});save();
  // review
  const rv=[];const pAt=i=>G.d[Math.min(23,i)].p;
  const buys=G.log.filter(l=>l.t==='buy'),sells=G.log.filter(l=>l.t==='sell');
  const amts=buys.map(b=>b.amt).sort((x,y)=>x-y),med=amts.length?amts[amts.length>>1]:0,regular=buys.length>=12;
  G.log.forEach(l=>{const later6=pAt(l.i+6)/G.d[l.i].p-1,later3=pAt(l.i+3)/G.d[l.i].p-1;
    if(l.t==='buy'&&l.chg>.2&&l.i>0&&!(regular&&l.amt<=med*2))rv.push({c:later3<0?'bad':'meh',m:`Month ${l.i+1} · bought ${fmt$(l.amt)} after a +${(l.chg*100).toFixed(0)}% month`,x:`Chasing a green month. Three months later the price was ${later3>=0?'+':''}${(later3*100).toFixed(0)}%.`});
    if(l.t==='sell'&&l.chg<-.15)rv.push({c:later6>0?'bad':'meh',m:`Month ${l.i+1} · sold ${l.frac===100?'everything':l.frac+'%'} after a ${(l.chg*100).toFixed(0)}% month`,x:later6>0?`Six months later the price was +${(later6*100).toFixed(0)}%. This is the classic panic sell.`:`It kept falling (${(later6*100).toFixed(0)}% six months on). Defensible — but you couldn’t have known.`});
    if(l.t==='buy'&&l.chg<-.15&&l.i>0)rv.push({c:later6>0?'good':'meh',m:`Month ${l.i+1} · bought ${fmt$(l.amt)} into a ${(l.chg*100).toFixed(0)}% month`,x:later6>0?`Six months later: +${(later6*100).toFixed(0)}%. Gardener instinct.`:`Six months later it was still lower (${(later6*100).toFixed(0)}%). Right habit, unlucky timing.`});
  });
  let idle=0;for(const l of G.log){if(l.t==='hold'&&G.btc===0&&buys.length===0)idle++;else break}
  if(buys.length===0)rv.push({c:'bad',m:'Never bought',x:'Sitting in cash guarantees you match "cash" — and lose to inflation. Even the gardener’s boring $500 a month beat that.'});
  else if(idle>=6)rv.push({c:'meh',m:`Waited ${idle} months before the first buy`,x:'Waiting for a better entry is timing in disguise. The gardener started month 1.'});
  if(buys.length>=18&&sells.length<=1)rv.push({c:'good',m:`Bought in ${buys.length} of 24 months`,x:'That is dollar-cost averaging. Whatever the result this season, this habit wins over cycles.'});
  if(buys.length===1&&buys[0].amt>=START*.9)rv.push({c:'meh',m:`All-in in month ${buys[0].i+1}`,x:'Lump sum. Wins on average, but this season it made your whole result about one day.'});
  if(buys.length+sells.length>14)rv.push({c:'meh',m:`${buys.length+sells.length} trades · ${fmt$(G.fees)} in fees`,x:'Every trade costs 1% here (and a taxable event in real life). Fewer, planned moves.'});
  if(!rv.length)rv.push({c:'good',m:'Nothing to flag',x:'Steady hands. The review is empty — which is the goal.'});
  const first=G.d[0].label,end=G.d[23].label;
  document.getElementById('gt').textContent='Season over';document.getElementById('gv').textContent='';
  document.getElementById('stage').innerHTML=`<div class="done-card"><div class="eyebrow">${S===1?'You beat the gardener':S===0?'The gardener beat you':'Dead heat with the gardener'}</div><div class="big">${fmt$(you)}</div><p>from $12,000</p><p><span class="rdelta ${d>=0?'up':'dn'}">${d>=0?'+':''}${d}</span> · season rating now <b class="mono">${a.sr}</b></p>
  <table class="res"><tr class="you"><td>You</td><td>${fmt$(you)}</td></tr><tr><td>The gardener · $500 every month, no matter what</td><td>${fmt$(dca)}</td></tr><tr><td>All-in on month 1</td><td>${fmt$(lump)}</td></tr><tr><td>Never bought</td><td>${fmt$(cash)}</td></tr></table>
  <div class="take" style="max-width:none"><div class="eyebrow">The reveal</div><p style="font-size:15px">You just played <b>${first} → ${end}</b>. Bitcoin went from ${fmt$(G.d[0].p)} to ${fmt$(last)}${G.d.some(x=>x.news&&/all-time high/i.test(x.news))?', through an all-time high':''}.</p></div>
  <div class="eyebrow" style="text-align:left">Move review</div><div class="review">${rv.map(r=>`<div class="rv ${r.c}"><b>${r.m}</b>${r.x}</div>`).join('')}</div>
  <div style="display:grid;gap:10px"><button class="btn primary block" id="again">Play another season</button><button class="btn ghost block" id="back">Back to the arena</button></div></div>`;
  document.getElementById('again').onclick=startSeason;document.getElementById('back').onclick=renderArena;G=null}

renderGarden();
